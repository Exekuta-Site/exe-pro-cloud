name: EXE PRO Cloudways CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build and validate
        run: npm run build

      - name: Verify opt-in prebuilt artifact contract
        run: npm run seal:prebuilt && npm run check:prebuilt

      - name: Package verified artifact without deployment
        run: npm run package:prebuilt && npm run check:bundle

      - name: Simulate archive transport and extraction without starting the server
        run: |
          PACKAGE_DIR=".prebuilt-dist/exe-pro-prebuilt-$(node -p 'require("./package.json").version')"
          tar -C "$PACKAGE_DIR" --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=ustar -cf - . | gzip -n > "$RUNNER_TEMP/exe-pro-prebuilt.tar.gz"
          mkdir -p "$RUNNER_TEMP/exe-pro-transferred"
          tar -xzf "$RUNNER_TEMP/exe-pro-prebuilt.tar.gz" -C "$RUNNER_TEMP/exe-pro-transferred"
          node tools/bundle-prebuilt.js verify "$RUNNER_TEMP/exe-pro-transferred"
          (cd "$RUNNER_TEMP/exe-pro-transferred" && node tools/prebuilt-artifact.js verify)

      # O pacote extraido veio do build do proprio runner, nao do Shard Cloud.
      # Esta etapa nao executa server.js, nao abre porta e nao conecta ao DB.
      - name: Disposable dependency laboratory (no server or database)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          LAB="$RUNNER_TEMP/exe-pro-lab-dependencies"
          HOME_LAB="$RUNNER_TEMP/exe-pro-lab-home"
          CACHE_LAB="$RUNNER_TEMP/exe-pro-lab-cache"
          mkdir -p "$LAB" "$HOME_LAB" "$CACHE_LAB"
          : > "$HOME_LAB/user.npmrc"
          : > "$HOME_LAB/global.npmrc"
          cp -a "$RUNNER_TEMP/exe-pro-transferred/." "$LAB/"
          cd "$LAB"
          test ! -e .env
          test ! -d node_modules
          node tools/prebuilt-artifact.js verify
          LOCK_BEFORE="$(sha256sum package-lock.json | cut -d' ' -f1)"
          env -i PATH="$PATH" HOME="$HOME_LAB" \
            npm_config_cache="$CACHE_LAB" \
            npm_config_userconfig="$HOME_LAB/user.npmrc" \
            npm_config_globalconfig="$HOME_LAB/global.npmrc" \
            npm_config_ignore_scripts=true \
            npm_config_audit=false npm_config_fund=false \
            npm_config_update_notifier=false \
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          LOCK_AFTER="$(sha256sum package-lock.json | cut -d' ' -f1)"
          test "$LOCK_BEFORE" = "$LOCK_AFTER"
          node tools/prebuilt-artifact.js verify
          npm ls --omit=dev --depth=0
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync("package-lock.json")); const b=JSON.parse(fs.readFileSync("node_modules/pg/package.json")); if(b.version !== a.packages["node_modules/pg"].version) process.exit(1); console.log("Lockfile pg version verified:", b.version);'
          node --check server.js
          echo "Disposable dependency lab passed without starting the server"

      - name: Prebuilt startup and package regression tests
        run: node --test tests/prebuilt-artifact.test.js tests/bundle-prebuilt.test.js

      - name: WhatsApp regression tests
        run: node --test tests/portal-response-headers.test.js tools/whatsapp420/history.test.js tools/whatsapp420/cleanup.test.js tools/site440/lead.test.js

      - name: Syntax check
        run: node --check server.js

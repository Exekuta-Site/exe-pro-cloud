<body>
<div id="login" class="login"><div class="login-card"><div class="brandline"><div class="logo" id="loginLogo">EX</div><div><div class="brandname" id="loginBrand">EXE PRO Cloud</div><div class="brandsub">Cloud Full 4.4.0</div></div></div><h1>Acesso Cloud</h1><p>Entre para acessar a operação comercial centralizada.</p><div id="userFields"><div class="field"><label>USUÁRIO</label><input id="loginUser" class="input" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>SENHA</label><input id="loginPass" class="input" type="password" autocomplete="current-password"></div></div><div id="keyFields" class="hidden"><div class="field"><label>CHAVE CLOUD LAB</label><input id="loginKey" class="input" type="password"></div></div><button class="btn primary" style="width:100%;margin-top:15px" onclick="doLogin()">Entrar</button><div id="loginMsg" class="tiny muted" style="margin-top:10px"></div></div></div>

<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const S={csrf:'',session:null,brand:{},snap:null,active:'dashboard',activity:null,users:null,integrations:null,security:null,ops:null,sessions:null,installPrompt:null,prospect:null,convLead:null,refreshTimer:null,lastNotifyKey:''};
const types=['lead','service','proposal','project','contract','receivable'];const statusOrder=['Novo','Contatado','Qualificado','Orçamento','Negociação','Cliente'];
const NAV=[['dashboard','▣','Visão Geral'],['today','✳','Hoje'],['prospect','⌕','Prospecção'],['leads','▤','Leads'],['clients','♟','Clientes'],['pipeline','▦','Pipeline'],['central','◷','Central Comercial'],['conversations','◉','Conversas'],['proposals','▧','Propostas'],['projects','◆','Projetos'],['finance','R$','Financeiro'],['agenda','□','Agenda'],['bi','⌁','BI Executivo']];
const NAV2=[['contracts','↻','Contratos'],['services','✦','Serviços'],['activities','↺','Atividades']];const NAV3=[['team','♟','Equipe'],['settings','⚙','Configurações']];
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function day(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v).slice(0,10):d.toLocaleDateString('pt-BR')}function dayKey(v){return String(v||'').slice(0,10)}function today(){return new Date().toISOString().slice(0,10)}function nowMonth(){return today().slice(0,7)}function n(v){const x=Number(v);return Number.isFinite(x)?x:0}function roleRank(r){r=String(r||'').toLowerCase();return r.includes('super')?5:r.includes('admin')?4:r.includes('gerente')?3:r.includes('vendedor')?2:1}function canWrite(){return roleRank(S.session?.user?.role)>1}function isAdmin(){return roleRank(S.session?.user?.role)>=4}function isMaster(){return roleRank(S.session?.user?.role)>=5}
function toast(msg,ms=3200){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),ms)}
async function api(path,opt={}){const h={'content-type':'application/json',...(opt.headers||{})};if(S.csrf&&opt.method&&opt.method!=='GET')h['x-exe-csrf']=S.csrf;const r=await fetch(path,{credentials:'same-origin',...opt,headers:h});let j={};try{j=await r.json()}catch{}if(r.status===401){showLogin();throw new Error(j.error||'Sessão expirada')}if(!r.ok){const e=new Error(j.error||`HTTP ${r.status}`);e.status=r.status;e.data=j;throw e}return j}
async function bootBrandPublic(){try{const j=await fetch('/api/web/branding/public').then(r=>r.json());if(j.ok)applyBrand(j.branding)}catch{}}
function applyBrand(b={}){S.brand={systemName:'EXE PRO',companyName:'EXEKUTA',primaryColor:'#8df900',primaryDark:'#5faa00',navColor:'#0b0b0b',tagline:'Prospecção - Relacionamento - Vendas',messagePresentation:'Somos uma agência de Marketing Digital com foco em SEO Orgânico e criação de sites.',messageSignature:'',...b};document.documentElement.style.setProperty('--accent',S.brand.primaryColor);document.documentElement.style.setProperty('--accent2',S.brand.primaryDark);document.documentElement.style.setProperty('--nav',S.brand.navColor);document.title=S.brand.systemName+' Cloud';$('loginBrand').textContent=S.brand.systemName+' Cloud';$('systemName').textContent=S.brand.systemName;$('companyName').textContent='by '+S.brand.companyName+' · Cloud Full 4.4.0';for(const id of ['loginLogo','sideLogo']){const el=$(id);if(!el)continue;el.innerHTML=S.brand.logoData?`<img src="${esc(S.brand.logoData)}">`:esc((S.brand.systemName||'EX').slice(0,2).toUpperCase())}}
async function checkSession(){await bootBrandPublic();try{const s=await api('/api/web/session');S.session=s;S.csrf=s.csrf;enterApp()}catch{showLogin();const c=await fetch('/api/web/config').then(r=>r.json()).catch(()=>({authMode:'user'}));$('userFields').classList.toggle('hidden',c.authMode==='key');$('keyFields').classList.toggle('hidden',c.authMode!=='key')}}
function showLogin(){$('login').classList.remove('hidden');$('shell').classList.add('hidden')}
async function doLogin(){try{$('loginMsg').textContent='Entrando...';const c=await fetch('/api/web/config').then(r=>r.json());const body=c.authMode==='key'?{key:$('loginKey').value,device:navigator.userAgent}:{username:$('loginUser').value,password:$('loginPass').value,device:navigator.userAgent};const j=await api('/api/web/login',{method:'POST',body:JSON.stringify(body)});S.session=j;S.csrf=j.csrf;enterApp()}catch(e){$('loginMsg').textContent=e.message}}
async function logout(){try{await api('/api/web/logout',{method:'POST',body:'{}'})}catch{}location.reload()}
async function enterApp(){$('login').classList.add('hidden');$('shell').classList.remove('hidden');$('who').textContent=`${S.session.user?.username||'Usuário'} · ${S.session.user?.role||''}`;buildNav();await refreshAll(false);clearInterval(S.refreshTimer);S.refreshTimer=setInterval(()=>refreshAll(false,true),60000)}
function navButton([id,ico,label]){return `<button data-sec="${id}" onclick="openSec('${id}')"><span class="ico">${ico}</span><span>${label}</span><span id="badge_${id}" class="badge hidden"></span></button>`}function buildNav(){$('nav').innerHTML=NAV.map(navButton).join('');$('nav2').innerHTML=NAV2.map(navButton).join('');$('nav3').innerHTML=NAV3.filter(x=>x[0]!=='team'||isAdmin()).filter(x=>x[0]!=='settings'||isMaster()).map(navButton).join('');markNav()}
function markNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.sec===S.active))}function toggleSide(){$('sidebar').classList.toggle('open')}function openSec(sec){S.active=sec;markNav();$('sidebar').classList.remove('open');render();scrollTo(0,0)}
async function refreshAll(show=true,silent=false){try{if(show)toast('Atualizando dados...');const [snap,brand]=await Promise.all([api('/api/web/snapshot'),api('/api/web/branding')]);S.snap=snap;applyBrand(brand.branding||{});$('cloudMeta').textContent=`v${snap.version} · cursor ${snap.cursor}`;if(S.active==='activities')S.activity=await api('/api/web/activity?limit=160');if(S.active==='team'&&isAdmin())S.users=(await api('/api/web/users')).users;render();updateBadges();if(show&&!silent)toast('Cloud atualizada.')}catch(e){if(!silent)toast(e.message,5000)}}
function rows(t){return S.snap?.entities?.[t]||[]}function payloads(t){return rows(t).map(r=>r.payload||{})}function leadById(id){return rows('lead').find(r=>r.entityId===id)?.payload||null}function leadName(id){const x=leadById(id);return x?.name||x?.companyName||'—'}function isClient(x){return x?.crmStatus==='Cliente'||!!x?.clientSince}function activeProject(x){return !['Concluído','Concluido','Cancelado'].includes(String(x?.status||''))}
function metrics(){const leads=payloads('lead'),projects=payloads('project'),rec=payloads('receivable'),contracts=payloads('contract'),props=payloads('proposal'),t=today(),m=nowMonth();const clients=leads.filter(isClient),newLeads=leads.filter(x=>(x.crmStatus||'Novo')==='Novo'),inProg=leads.filter(x=>!['Novo','Cliente','Descartado'].includes(x.crmStatus||'Novo')),followToday=leads.filter(x=>dayKey(x.nextActionAt)===t),overdue=leads.filter(x=>dayKey(x.nextActionAt)&&dayKey(x.nextActionAt)<t&&!['Cliente','Descartado'].includes(x.crmStatus||'')),pAct=projects.filter(activeProject),pLate=pAct.filter(x=>dayKey(x.dueDate)&&dayKey(x.dueDate)<t),openR=rec.filter(x=>!['Pago','Cancelado'].includes(x.status||'')),paid=rec.filter(x=>x.status==='Pago'&&dayKey(x.paidAt||x.updatedAt).startsWith(m));return{leads,projects,rec,contracts,props,clients,newLeads,inProg,followToday,overdue,pAct,pLate,openR,received:paid.reduce((a,x)=>a+n(x.amount),0),mrr:contracts.filter(x=>x.status==='Ativo').reduce((a,x)=>a+n(x.monthlyAmount),0),toReceive:openR.reduce((a,x)=>a+n(x.amount),0),conversion:leads.length?clients.length/leads.length*100:0}}
function head(ey,title,sub,actions=''){return `<div class="section-head"><div><div class="eyebrow">${ey}</div><h1 class="title">${title}</h1><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`}function kpi(label,value,small=''){return `<div class="kpi"><label>${label}</label><strong>${value}</strong><small>${small}</small></div>`}function status(v){const x=String(v||'—');const c=/pago|cliente|conclu|ativo/i.test(x)?'ok':/atras|venc|cancel|recus/i.test(x)?'bad':/negocia|orçamento|apresent|pendente|revisão/i.test(x)?'warn':'';return `<span class="status ${c}">${esc(x)}</span>`}
function render(){if(!S.snap)return;$('content').innerHTML=({dashboard:renderDashboard,today:renderToday,prospect:renderProspect,leads:()=>renderLeadList(false),clients:()=>renderLeadList(true),pipeline:renderPipeline,central:renderCentral,conversations:renderConversations,proposals:()=>renderEntityList('proposal'),projects:()=>renderEntityList('project'),finance:renderFinance,agenda:renderAgenda,bi:renderBI,contracts:()=>renderEntityList('contract'),services:()=>renderEntityList('service'),activities:renderActivities,team:renderTeam,settings:renderSettings}[S.active]||renderDashboard)()}
function renderDashboard(){const m=metrics();let pCounts=statusOrder.map(s=>[s,m.leads.filter(x=>(x.crmStatus||'Novo')===s).length]);return head('EXE PRO · PERFORMANCE COMERCIAL',`Olá, ${esc(S.session.user?.username||'usuário')}`,'Prospecção, pipeline, clientes e operação Cloud em uma única visão.',`<button class="btn" onclick="openSec('prospect')">⌕ Nova prospecção</button><button class="btn" onclick="newClient()">+ Novo cliente</button><button class="btn" onclick="openSec('today')">✳ Central Hoje</button><button class="btn primary" onclick="openSec('pipeline')">▦ Abrir funil</button>`)+`<div class="grid kpis">${kpi('Leads no CRM',m.leads.length,'base central')}${kpi('Novos',m.newLeads.length,'ainda sem contato')}${kpi('Em andamento',m.inProg.length,'contato até orçamento')}${kpi('Clientes',m.clients.length,'negócios convertidos')}${kpi('Conversão',m.conversion.toFixed(1)+'%','clientes ÷ leads')}${kpi('Follow-ups hoje',m.followToday.length,'ações comerciais')}${kpi('Atrasados',m.overdue.length,'precisam de atenção')}${kpi('Projetos ativos',m.pAct.length,`${m.pLate.length} atrasado(s)`)}${kpi('A receber',money(m.toReceive),'cobranças pendentes')}${kpi('Recebido no mês',money(m.received),'pagamentos confirmados')}</div><div class="grid cols2"><div class="card"><h3>Pipeline comercial</h3><p class="help">Distribuição dos leads por etapa.</p>${pCounts.map(([s,c])=>`<div class="chartbar"><span>${esc(s)}</span><div class="bar"><i style="width:${m.leads.length?Math.max(2,c/m.leads.length*100):0}%"></i></div><b>${c}</b></div>`).join('')}</div><div class="card"><h3>Atividades prioritárias</h3><p class="help">O que merece atenção agora.</p>${priorityItems().slice(0,8).map(alertHtml).join('')||'<div class="empty">Nenhuma prioridade crítica.</div>'}</div></div>`}
function priorityItems(){const m=metrics(),t=today(),out=[];for(const x of m.leads){const d=dayKey(x.nextActionAt);if(d&&d<t)out.push({kind:'critical',ico:'◷',title:`${x.name||x.companyName} · Follow-up atrasado`,detail:`${day(x.nextActionAt)} · ${x.nextActionNote||'Retomar contato'}`,leadId:x.id});else if(d===t)out.push({kind:'warning',ico:'◷',title:`${x.name||x.companyName} · Follow-up hoje`,detail:x.nextActionNote||'Ação comercial agendada',leadId:x.id})}for(const x of m.pLate)out.push({kind:'critical',ico:'◆',title:`Projeto atrasado · ${x.title||'Projeto'}`,detail:`Prazo ${day(x.dueDate)} · ${leadName(x.leadId)}`,leadId:x.leadId});for(const x of m.openR.filter(x=>dayKey(x.dueDate)&&dayKey(x.dueDate)<t))out.push({kind:'critical',ico:'R$',title:`Cobrança vencida · ${x.description||'Cobrança'}`,detail:`${leadName(x.leadId)} · ${money(x.amount)} · ${day(x.dueDate)}`,leadId:x.leadId});for(const p of m.props.filter(x=>['Apresentada','Em negociação'].includes(x.status)))out.push({kind:'warning',ico:'▧',title:`Proposta aberta · ${p.title||'Proposta'}`,detail:`${leadName(p.leadId)} · ${status(p.status).replace(/<[^>]+>/g,'')}`,leadId:p.leadId});return out}
function alertHtml(x){return `<div class="alert ${x.kind}"><div class="mark">${x.ico}</div><div><h4>${esc(x.title)}</h4><p>${esc(x.detail)}</p></div>${x.leadId?`<button class="btn sm" onclick="openLead('${esc(x.leadId)}')">360°</button>`:''}</div>`}
function renderToday(){const items=priorityItems();return head('CENTRAL HOJE','O que precisa da sua atenção','Follow-ups, propostas, projetos e financeiro reunidos numa única fila.')+`<div class="grid kpis">${kpi('Prioridades',items.filter(x=>x.kind==='critical').length,'críticas')}${kpi('Follow-ups',items.filter(x=>x.ico==='◷').length,'hoje ou atrasados')}${kpi('Propostas',items.filter(x=>x.ico==='▧').length,'em andamento')}${kpi('Projetos',items.filter(x=>x.ico==='◆').length,'com atenção')}${kpi('Financeiro',items.filter(x=>x.ico==='R$').length,'vencidos')}</div><div class="card"><div class="alert-list">${items.map(alertHtml).join('')||'<div class="empty">Tudo em dia.</div>'}</div></div>`}
function renderProspect(){return head('PROSPECÇÃO INTELIGENTE','Novas oportunidades','Busque empresas diretamente pela Cloud e salve no CRM.',`<button class="btn" onclick="openSec('leads')">Ver Leads</button>`)+`<div class="card"><div class="form-grid"><div class="field"><label>Segmento / tipo de empresa</label><input id="ps_segment" class="input" placeholder="Ex.: Construção"></div><div class="field"><label>Bairro / região</label><select id="ps_region" class="input" onchange="psRegionChanged()"><option value="">— Selecione —</option>'+PROSPECT_REGIONS.map(function(r){return '<option>'+r.name+'</option>'}).join('')+'<option value="__custom__">Outra (digitar)</option></select><input id="ps_region_custom" class="input hidden" placeholder="Digite o bairro/região" style="margin-top:6px"></div><div class="field"><label>Cidade</label><select id="ps_city" class="input" onchange="psCityChanged()"><option value="">— Selecione a região primeiro —</option></select><input id="ps_city_custom" class="input hidden" placeholder="Digite a cidade" style="margin-top:6px"></div><div class="field"><label>UF</label><input id="ps_state" class="input" maxlength="2" placeholder="RJ"></div><div class="field"><label>Quantidade Maps</label><select id="ps_limit"><option>10</option><option selected>20</option><option>40</option></select></div><div class="field"><label>Fontes</label><div style="display:flex;gap:9px;flex-wrap:wrap;padding-top:8px"><label><input type="checkbox" id="ps_maps" checked> Maps</label><label><input type="checkbox" id="ps_google"> Google</label><label><input type="checkbox" id="ps_instagram"> Instagram</label><label><input type="checkbox" id="ps_facebook"> Facebook</label></div></div></div><button class="btn primary" style="margin-top:12px" onclick="doProspect()">⌕ Prospectar agora</button><div class="tiny muted" style="margin-top:8px">As chaves Google Places e Serper ficam criptografadas no servidor Cloud e podem ser configuradas em Configurações.</div></div><div id="prospectResults" style="margin-top:14px">${renderProspectResults()}</div>`}
const PROSPECT_REGIONS=[{"name":"Guaratiba","cities":["Rio de Janeiro"]},{"name":"Barra da Tijuca","cities":["Rio de Janeiro"]},{"name":"Recreio dos Bandeirantes","cities":["Rio de Janeiro"]},{"name":"Jacarepaguá","cities":["Rio de Janeiro"]},{"name":"Campo Grande","cities":["Rio de Janeiro"]},{"name":"Santa Cruz","cities":["Rio de Janeiro"]},{"name":"Zona Sul RJ","cities":["Rio de Janeiro"]},{"name":"Centro RJ","cities":["Rio de Janeiro"]},{"name":"Zona Norte RJ","cities":["Rio de Janeiro"]},{"name":"Baixada Fluminense","cities":["Duque de Caxias","Nova Iguaçu","Belford Roxo","São João de Meriti","Queimados","Japeri","Mesquita","Nilópolis","Magé","Seropédica"]},{"name":"Grande Niterói","cities":["Niterói","São Gonçalo","Maricá","Itaboraí"]},{"name":"Região dos Lagos","cities":["Cabo Frio","Armação dos Búzios","São Pedro da Aldeia","Iguaba Grande","Saquarema","Araruama","Arraial do Cabo"]}];
function psRegionChanged(){const v=document.getElementById('ps_region').value||'';document.getElementById('ps_region_custom').classList.toggle('hidden',v!=='__custom__');const sel=document.getElementById('ps_city');const r=PROSPECT_REGIONS.find(function(x){return x.name===v});sel.innerHTML=r?r.cities.map(function(c){return '<option>'+c+'</option>'}).join('')+'<option value="__custom__">Outra (digitar)</option>':'<option value="">— Selecione a região primeiro —</option>';document.getElementById('ps_city_custom').classList.add('hidden')}

function renderAgenda(){const ymd=today(),base=new Date(ymd+'T12:00:00'),year=base.getFullYear(),month=base.getMonth(),first=new Date(year,month,1),last=new Date(year,month+1,0),offset=first.getDay(),events={};function add(d,txt){d=dayKey(d);if(!d)return;(events[d]??=[]).push(txt)}for(const x of payloads('lead'))add(x.nextActionAt,`◷ ${x.name||x.companyName}`);for(const x of payloads('project'))add(x.dueDate,`◆ ${x.title||'Projeto'}`);for(const x of payloads('receivable'))add(x.dueDate,`R$ ${x.description||'Cobrança'}`);for(const x of payloads('contract'))add(x.endDate,`↻ ${x.title||'Contrato'}`);for(const x of payloads('proposal'))add(x.validUntil,`▧ ${x.title||'Proposta'}`);let cells='';for(let i=0;i<offset;i++)cells+='<div class="day"></div>';for(let d=1;d<=last.getDate();d++){const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="day" style="${key===ymd?'border-color:var(--accent)':''}"><div class="num">${d}</div>${(events[key]||[]).slice(0,5).map(x=>`<div class="event">${esc(x)}</div>`).join('')}</div>`}return head('AGENDA UNIFICADA',new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(base),'Follow-ups, projetos, financeiro, contratos e propostas no mesmo calendário.')+`<div class="agenda">${cells}</div>`}

pi"><label>Versão</label><strong>${esc(ops.version||'—')}</strong><small>PostgreSQL</small></div><div class="kpi"><label>DB latency</label><strong>${ops.dbLatencyMs??'—'} ms</strong><small>consulta de prontidão</small></div><div class="kpi"><label>Uptime</label><strong>${ops.uptimeSeconds?Math.floor(ops.uptimeSeconds/60)+' min':'—'}</strong><small>processo atual</small></div><div class="kpi"><label>Memória</label><strong>${ops.memory?.rssMB??'—'} MB</strong><small>RSS do processo</small></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="downloadBackup()">⇩ Baixar backup lógico</button><button class="btn" onclick="chooseBackupValidation()">✓ Validar backup</button><input id="backupValidateFile" type="file" accept="application/json,.json" class="hidden" onchange="validateBackupFile(this)"></div><div class="notice" style="margin-top:12px">O backup lógico é uma segunda camada de proteção. Mantenha também o backup automático do Cloudways habilitado para o PostgreSQL.</div><div class="tiny muted" style="margin-top:8px">Registros: ${ops.records??'—'} · Alterações: ${ops.changes??'—'} · Instalações: ${ops.installations??'—'}</div></div></div>`}
async function saveBranding(){try{const branding={...S.brand,systemName:$('cfg_system').value,companyName:$('cfg_company').value,tagline:$('cfg_tag').value,primaryColor:$('cfg_color').value,navColor:$('cfg_nav').value,messagePresentation:$('cfg_intro').value,messageSignature:$('cfg_sig').value};const j=await api('/api/web/branding',{method:'PATCH',body:JSON.stringify({branding})});applyBrand(j.branding);render();toast('Identidade Cloud atualizada.')}catch(e){toast(e.message)}}async function saveIntegrations(){try{S.integrations=await api('/api/web/integrations',{method:'PATCH',body:JSON.stringify({googlePlaces:$('cfg_google').value,serper:$('cfg_serper').value})});render();toast('Integrações Cloud salvas.')}catch(e){toast(e.message)}}

function showEntityModal(r){const x=r.payload||{},t=r.entityType;$('modalEyebrow').textContent=t==='lead'?'CLIENTE 360°':t.toUpperCase();$('modalTitle').textContent=x.name||x.companyName||x.title||x.description||'Registro';$('modalMeta').textContent=`ID ${r.entityId} · versão Cloud ${r.cloudVersion}`;let h='<div class="form-grid">';if(t==='lead'){h+=field('name','EMPRESA',x.name||x.companyName||'','text',true)+field('crmStatus','STATUS',x.crmStatus||'Novo','text',false,['Novo','Contatado','Qualificado','Orçamento','Negociação','Cliente','Descartado'])+field('assignedTo','RESPONSÁVEL',x.assignedTo||'')+field('companyContactName','CONTATO',x.companyContactName||'')+field('companyContactRole','CARGO',x.companyContactRole||'')+field('phone','TELEFONE',x.phone||'')+field('whatsapp','WHATSAPP',x.whatsapp||'')+field('telegram','TELEGRAM',x.telegram||'')+field('email','E-MAIL',x.email||'')+field('website','SITE',x.website||'')+field('dealValue','VALOR POTENCIAL',x.dealValue||0,'number')+field('nextActionAt','PRÓXIMA AÇÃO',dayKey(x.nextActionAt),'date')+field('nextActionNote','AÇÃO / FOLLOW-UP',x.nextActionNote||'','text',true)+field('notes','OBSERVAÇÕES',x.notes||'','textarea',true)}else if(t==='proposal'){h+=field('title','TÍTULO',x.title||'','text',true)+field('status','STATUS',x.status||'Rascunho','text',false,['Rascunho','Apresentada','Em negociação','Aprovada','Recusada','Expirada'])+field('validityDays','VALIDADE',x.validityDays||15,'number')+field('setupNet','IMPLANTAÇÃO',x.setupNet||x.setupTotal||0,'number')+field('monthlyNet','MENSALIDADE',x.monthlyNet||x.monthlyTotal||0,'number')+field('paymentTerms','CONDIÇÕES',x.paymentTerms||'','text',true)+field('notes','OBSERVAÇÕES',x.notes||'','textarea',true)}else if(t==='project'){h+=field('title','PROJETO',x.title||'','text',true)+field('status','STATUS',x.status||'Planejamento','text',false,['Planejamento','Em andamento','Em revisão','Concluído','Pausado','Cancelado'])+field('priority','PRIORIDADE',x.priority||'Normal','text',false,['Baixa','Normal','Alta','Urgente'])+field('owner','RESPONSÁVEL',x.owner||'')+field('startDate','INÍCIO',dayKey(x.startDate),'date')+field('dueDate','PRAZO',dayKey(x.dueDate),'date')+field('notes','OBSERVAÇÕES',x.notes||'','textarea',true)}else if(t==='receivable'){h+=field('description','DESCRIÇÃO',x.description||'','text',true)+field('status','STATUS',x.status||'Pendente','text',false,['Pendente','Pago','Cancelado'])+field('amount','VALOR',x.amount||0,'number')+field('dueDate','VENCIMENTO',dayKey(x.dueDate),'date')+field('paidAt','PAGO EM',dayKey(x.paidAt),'date')+field('paymentMethod','FORMA DE PAGAMENTO',x.paymentMethod||'')+field('notes','OBSERVAÇÕES',x.notes||'','textarea',true)}else if(t==='contract'){h+=field('title','CONTRATO',x.title||'','text',true)+field('status','STATUS',x.status||'Ativo','text',false,['Ativo','Pausado','Encerrado','Cancelado'])+field('monthlyAmount','MENSALIDADE',x.monthlyAmount||0,'number')+field('billingDay','DIA VENCIMENTO',x.billingDay||10,'number')+field('startDate','INÍCIO',dayKey(x.startDate),'date')+field('endDate','FIM',dayKey(x.endDate),'date')+field('notes','OBSERVAÇÕES',x.notes||'','textarea',true)}else{h+=field('name','SERVIÇO',x.name||'')+field('active','ATIVO',x.active===false?'Não':'Sim','text',false,['Sim','Não'])+field('billingType','TIPO',x.billingType||'Projeto','text',false,['Projeto','Recorrente','Hora','Outro'])+field('basePrice','VALOR BASE',x.basePrice||0,'number')+field('category','CATEGORIA',x.category||'Marketing Digital')+field('description','DESCRIÇÃO',x.description||'','textarea',true)}h+='</div>';if(t==='lead')h+=`<div class="actions" style="margin-top:12px"><button class="btn" onclick="S.convLead='${esc(r.entityId)}';closeModal();openSec('conversations')">◉ Conversar</button><button class="btn" onclick="scheduleLead('${esc(r.entityId)}')">◷ Follow-up</button></div>`;h+=`<div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveEntityModal('${t}','${r.entityId}',${r.cloudVersion})">Salvar alterações</button></div>`;$('modalBody').innerHTML=h;$('modalBack').classList.remove('hidden')}
function closeModal(){$('modalBack').classList.add('hidden')}function modalVal(id){return $('m_'+id)?.value??''}
async function saveEntityModal(t,id,ver){const ids={lead:['name','crmStatus','assignedTo','companyContactName','companyContactRole','phone','whatsapp','telegram','email','website','dealValue','nextActionAt','nextActionNote','notes'],proposal:['title','status','validityDays','setupNet','monthlyNet','paymentTerms','notes'],project:['title','status','priority','owner','startDate','dueDate','notes'],receivable:['description','status','amount','dueDate','paidAt','paymentMethod','notes'],contract:['title','status','monthlyAmount','billingDay','startDate','endDate','notes'],service:['name','active','billingType','basePrice','category','description']}[t],patch={};for(const k of ids){let v=modalVal(k);if(['dealValue','validityDays','setupNet','monthlyNet','amount','monthlyAmount','billingDay','basePrice'].includes(k))v=n(v);if(k==='active')v=v==='Sim';patch[k]=v}try{const j=await api('/api/web/entity',{method:'PATCH',body:JSON.stringify({entityType:t,entityId:id,expectedCloudVersion:ver,patch})});closeModal();await refreshAll(false,true);toast('Registro salvo na Cloud.')}catch(e){toast(e.status===409?'Conflito: recarregue o registro antes de salvar.':e.message,5500)}}

function showCreateModal(t,seed){const titles={lead:'Novo cliente',project:'Novo projeto',proposal:'Nova proposta',receivable:'Nova cobrança',contract:'Novo contrato',service:'Novo serviço'};$('modalEyebrow').textContent='NOVO REGISTRO';$('modalTitle').textContent=titles[t]||'Novo';$('modalMeta').textContent='Será criado diretamente no banco Cloud.';let h='<div class="form-grid">',leads=payloads('lead'),leadOpts=leads.map(x=>x.id+' · '+(x.name||x.companyName));if(t==='lead')h+=field('name','EMPRESA','')+field('crmStatus','STATUS',seed.crmStatus||'Novo','text',false,['Novo','Contatado','Qualificado','Orçamento','Negociação','Cliente'])+field('phone','TELEFONE','')+field('whatsapp','WHATSAPP','')+field('email','E-MAIL','')+field('website','SITE','')+field('assignedTo','RESPONSÁVEL',S.session.user?.username||'')+field('notes','OBSERVAÇÕES','','textarea',true);if(t==='project')h+=field('title','PROJETO','')+field('leadId','ID DO CLIENTE','')+field('owner','RESPONSÁVEL',S.session.user?.username||'')+field('dueDate','PRAZO','','date')+field('status','STATUS','Planejamento','text',false,['Planejamento','Em andamento','Em revisão','Concluído'])+field('notes','OBSERVAÇÕES','','textarea',true);if(t==='proposal')h+=field('title','TÍTULO','Proposta comercial')+field('leadId','ID DO CLIENTE','')+field('status','STATUS','Rascunho','text',false,['Rascunho','Apresentada','Em negociação','Aprovada'])+field('setupNet','IMPLANTAÇÃO',0,'number')+field('monthlyNet','MENSALIDADE',0,'number')+field('notes','OBSERVAÇÕES','','textarea',true);if(t==='receivable')h+=field('description','DESCRIÇÃO','')+field('leadId','ID DO CLIENTE','')+field('amount','VALOR',0,'number')+field('dueDate','VENCIMENTO','','date')+field('status','STATUS','Pendente','text',false,['Pendente','Pago']);if(t==='contract')h+=field('title','CONTRATO','')+field('leadId','ID DO CLIENTE','')+field('monthlyAmount','MENSALIDADE',0,'number')+field('billingDay','DIA VENCIMENTO',10,'number')+field('status','STATUS','Ativo','text',false,['Ativo','Pausado','Encerrado']);if(t==='service')h+=field('name','SERVIÇO','')+field('basePrice','VALOR BASE',0,'number')+field('billingType','TIPO','Projeto','text',false,['Projeto','Recorrente','Hora','Outro'])+field('category','CATEGORIA','Marketing Digital')+field('description','DESCRIÇÃO','','textarea',true);h+='</div><button class="btn primary" style="margin-top:14px" onclick="createFromModal(\''+t+'\')">Criar</button>';$('modalBody').innerHTML=h;$('modalBack').classList.remove('hidden')}
async function createFromModal(t){let p={};const ids={lead:['name','crmStatus','phone','whatsapp','email','website','assignedTo','notes'],project:['title','leadId','owner','dueDate','status','notes'],proposal:['title','leadId','status','setupNet','monthlyNet','notes'],receivable:['description','leadId','amount','dueDate','status'],contract:['title','leadId','monthlyAmount','billingDay','status'],service:['name','basePrice','billingType','category','description']}[t];for(const k of ids){let v=modalVal(k);if(['setupNet','monthlyNet','amount','monthlyAmount','billingDay','basePrice'].includes(k))v=n(v);p[k]=v}if(t==='lead'&&p.crmStatus==='Cliente')p.clientSince=today();try{await api('/api/web/entity',{method:'POST',body:JSON.stringify({entityType:t,payload:p})});closeModal();await refreshAll(false,true);toast('Registro criado.')}catch(e){toast(e.message)}}
function scheduleLead(id){const r=rows('lead').find(x=>x.entityId===id);if(!r)return;const d=prompt('Data do follow-up (AAAA-MM-DD):',dayKey(r.payload.nextActionAt)||today());if(!d)return;const note=prompt('Próxima ação:',r.payload.nextActionNote||'Retornar contato');if(note===null)return;patchEntity(r,{nextActionAt:d,nextActionNote:note}).then(()=>refreshAll(false,true)).then(()=>toast('Follow-up agendado.')).catch(e=>toast(e.message))}
function newCloudUser(){$('modalEyebrow').textContent='EQUIPE CLOUD';$('modalTitle').textContent='Novo usuário';$('modalMeta').textContent='Conta de acesso ao EXE PRO Cloud';$('modalBody').innerHTML=`<div class="form-grid">${field('cu_user','USUÁRIO','')}${field('cu_pass','SENHA','','password')}${field('cu_role','PERFIL','Vendedor','text',false,['Administrador','Gerente','Vendedor','Visualizador'].concat(isMaster()?['Super Admin']:[]))}</div><button class="btn primary" style="margin-top:14px" onclick="createCloudUser()">Criar usuário</button>`;$('modalBack').classList.remove('hidden')}async function createCloudUser(){try{await api('/api/web/users',{method:'POST',body:JSON.stringify({username:modalVal('cu_user'),password:modalVal('cu_pass'),role:modalVal('cu_role')})});closeModal();S.users=null;renderTeamAsync();toast('Usuário criado.')}catch(e){toast(e.message)}}function editCloudUser(id){const u=S.users.find(x=>x.user_id===id);if(!u)return;$('modalEyebrow').textContent='EQUIPE CLOUD';$('modalTitle').textContent=u.username;$('modalMeta').textContent='Permissões da conta';$('modalBody').innerHTML=`<div class="form-grid">${field('eu_role','PERFIL',u.role,'text',false,['Administrador','Gerente','Vendedor','Visualizador'].concat(isMaster()?['Super Admin']:[]))}${field('eu_active','ATIVO',u.active?'Sim':'Não','text',false,['Sim','Não'])}${field('eu_pass','NOVA SENHA (opcional)','','password',true)}</div><button class="btn primary" style="margin-top:14px" onclick="saveCloudUser('${id}')">Salvar</button>`;$('modalBack').classList.remove('hidden')}async function saveCloudUser(id){try{await api('/api/web/users',{method:'PATCH',body:JSON.stringify({userId:id,role:modalVal('eu_role'),active:modalVal('eu_active')==='Sim',password:modalVal('eu_pass')})});closeModal();S.users=null;renderTeamAsync();toast('Usuário atualizado.')}catch(e){toast(e.message)}}

</script><script id="prospectParity364Script">(function(){

  function score(x){const saved=Number(x?.leadScore);if(Number.isFinite(saved)&&saved>0)return Math.max(0,Math.min(100,saved));let s=20;if(x?.phone)s+=25;if(x?.website)s+=20;if(Number(x?.rating)>=4)s+=12;if(Number(x?.reviews)>=20)s+=8;if(x?.instagram)s+=8;if(x?.facebook)s+=7;return Math.min(100,s)}
  function scoreBand(v){return v>=75?'Lead quente':v>=55?'Bom potencial':'Em observação'}
  function asDate(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
  function startToday(){const d=new Date();d.setHours(0,0,0,0);return d}
  function endToday(){const d=new Date();d.setHours(23,59,59,999);return d}
  function daysSince(v){const d=asDate(v);if(!d)return null;return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}
  function rowById(id){return rows('lead').find(r=>String(r.entityId)===String(id))||null}
  function payloadById(id){return rowById(id)?.payload||null}
  function leadLastActivity(row){const x=row?.payload||{};return asDate(x.lastContactAt)||asDate(x.prospectedAt)||asDate(row?.updatedAt)||null}
  function inactiveDays(row){const d=leadLastActivity(row);return d?Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)):999}
  function isOpenLead(x){return !['Cliente','Descartado'].includes(String(x?.crmStatus||'Novo'))}
  function dueState(x){const d=asDate(x?.nextActionAt);if(!d)return'nodate';if(d<startToday())return'overdue';if(d<=endToday())return'today';return'upcoming'}
  function openProposalRows(){return rows('proposal').filter(r=>['Apresentada','Em negociação'].includes(String(r.payload?.status||'')))}
  function proposalForLead(id){return openProposalRows().find(r=>String(r.payload?.leadId||'')===String(id))||null}
  function proposalAge(row){return daysSince(row?.updatedAt)||0}
  function commercialStats(){const cfg=rulesCfg(),leads=rows('lead').filter(r=>isOpenLead(r.payload||{})),proposals=openProposalRows();return{
    active:leads.length,
    hot:leads.filter(r=>score(r.payload)>=75).length,
    overdue:leads.filter(r=>dueState(r.payload)==='overdue').length,
    today:leads.filter(r=>dueState(r.payload)==='today').length,
    noContact:leads.filter(r=>!r.payload?.lastContactAt&&Number(r.payload?.contactAttempts||0)===0).length,
    stale:leads.filter(r=>inactiveDays(r)>=Number(cfg.commercialStaleDays||7)).length,
    proposals:proposals.length
  }}
  function priority(row){const x=row.payload||{},cfg=rulesCfg();let p=0;if(dueState(x)==='overdue')p+=1000;if(dueState(x)==='today')p+=800;if(score(x)>=75)p+=300;if(!x.lastContactAt&&Number(x.contactAttempts||0)===0)p+=240;if(inactiveDays(row)>=Number(cfg.commercialStaleDays||7))p+=200;if(proposalForLead(row.entityId))p+=180;p+=score(x);return p}
  function filteredCentralRows(){const cfg=rulesCfg();let list=rows('lead').filter(r=>isOpenLead(r.payload||{}));if(centralFilter==='hot')list=list.filter(r=>score(r.payload)>=75);else if(centralFilter==='overdue')list=list.filter(r=>dueState(r.payload)==='overdue');else if(centralFilter==='today')list=list.filter(r=>dueState(r.payload)==='today');else if(centralFilter==='nocontact')list=list.filter(r=>!r.payload?.lastContactAt&&Number(r.payload?.contactAttempts||0)===0);else if(centralFilter==='stale')list=list.filter(r=>inactiveDays(r)>=Number(cfg.commercialStaleDays||7));else if(centralFilter==='proposal')list=list.filter(r=>!!proposalForLead(r.entityId));return list.sort((a,b)=>priority(b)-priority(a)).slice(0,100)}
  function ruleSummary(){const r=rulesCfg();return `1º contato em até ${Number(r.commercialFirstContactHours||4)}h · sem resposta ${Number(r.commercialNoResponseDays||2)}d · lead parado ${Number(r.commercialStaleDays||7)}d · proposta ${Number(r.commercialProposalDays||3)}d`}
  function dueLabel(x){const s=dueState(x);if(s==='overdue')return'Follow-up atrasado';if(s==='today')return'Follow-up hoje';if(s==='upcoming')return'Próxima ação '+day(x.nextActionAt);return'Sem próxima ação'}
  function contactLabel(row){const x=row.payload||{};if(x.lastContactAt)return `Último contato ${day(x.lastContactAt)}${x.lastContactChannel?' · '+x.lastContactChannel:''}`;if(Number(x.contactAttempts||0)>0)return `${Number(x.contactAttempts||0)} tentativa(s), sem data do último contato`;return'Nenhum contato registrado'}
  function categoryFlags(row){const x=row.payload||{},cfg=rulesCfg(),a=[];if(dueState(x)==='overdue')a.push(['critical','Atrasado']);else if(dueState(x)==='today')a.push(['today','Hoje']);if(score(x)>=75)a.push(['hot','Lead quente']);if(!x.lastContactAt&&Number(x.contactAttempts||0)===0)a.push(['neutral','Sem contato']);if(inactiveDays(row)>=Number(cfg.commercialStaleDays||7))a.push(['warn','Parado '+inactiveDays(row)+'d']);if(proposalForLead(row.entityId))a.push(['purple','Proposta aberta']);return a}
  function messageForLead(x){const name=x?.companyContactName?` ${x.companyContactName}`:'';const company=x?.name||x?.companyName||'sua empresa';const segment=x?.segment||'seu segmento';const presentation=String(S.brand?.messagePresentation||'').trim();const signature=String(S.brand?.messageSignature||'').trim();let text=`Olá${name}! Tudo bem? Aqui é da ${S.brand?.companyName||'EXEKUTA'}. Encontrei a ${company} em uma pesquisa de ${segment} e gostaria de falar sobre uma oportunidade para fortalecer a presença digital da empresa.`;if(!x?.website)text+=' Notei que pode haver espaço para melhorar a presença online e captação de novos contatos.';else if(Number(x?.rating)>=4)text+=' Vi também que a empresa já possui uma boa presença no Google, o que abre espaço para trabalharmos crescimento e conversão.';if(presentation)text+=' '+presentation;if(signature)text+='\n\n'+signature;return text}
  function nextAtDays(days,hour){const d=new Date();d.setDate(d.getDate()+Number(days||0));d.setHours(Number(hour||9),0,0,0);if(d.getTime()<Date.now()+300000)d.setDate(d.getDate()+1);return d.toISOString()}
  function firstContactAt(hours){return new Date(Date.now()+Math.max(1,Number(hours||4))*3600000).toISOString()}

  async function patchLead(id,patch,msg){const row=rowById(id);if(!row)return toast('Lead não encontrado.');try{await patchEntity(row,patch);await refreshAll(false,true);render();if(msg)toast(msg)}catch(e){toast(e.message,5000)}}

  window.cloud366SetFilter=function(f){centralFilter=f||'all';if(S.active==='central')render()};
  window.cloud366OpenWhatsApp=function(id){const x=payloadById(id);if(!x)return;const n=waNumber(x);if(!n||!probableWhatsapp(x))return toast('Este contato não possui WhatsApp provável.');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(messageForLead(x)),'_blank','noopener')};
  window.cloud366GenerateMessage=function(id){const x=payloadById(id);if(!x)return;const text=messageForLead(x);$('modalEyebrow').textContent='ABORDAGEM COMERCIAL';$('modalTitle').textContent=x.name||x.companyName||'Mensagem';$('modalMeta').textContent=`Lead Score ${score(x)}% · ${scoreBand(score(x))}`;$('modalBody').innerHTML=`<div class="field"><label>MENSAGEM</label><textarea id="cloud366Message" rows="8">${esc(text)}</textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="cloud366CopyMessage()">Copiar mensagem</button>${probableWhatsapp(x)?`<button class="btn" onclick="cloud366SendMessage('${esc(id)}')">Abrir WhatsApp</button>`:''}</div><div class="notice" style="margin-top:12px">O envio continua sob seu controle. O EXE PRO apenas prepara a mensagem e abre o canal.</div>`;$('modalBack').classList.remove('hidden')};
  window.cloud366CopyMessage=async function(){const el=$('cloud366Message');if(!el)return;try{await navigator.clipboard.writeText(el.value);toast('Mensagem copiada.')}catch{el.select();document.execCommand('copy');toast('Mensagem copiada.')}};
  window.cloud366SendMessage=function(id){const x=payloadById(id),el=$('cloud366Message');if(!x||!el)return;const n=waNumber(x);if(!n)return toast('Telefone inválido para WhatsApp.');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(el.value),'_blank','noopener')};
  window.cloud366MarkContacted=async function(id){const row=rowById(id);if(!row)return;const x=row.payload||{},cfg=rulesCfg(),patch={lastContactAt:new Date().toISOString(),lastContactChannel:'Contato comercial',contactAttempts:Number(x.contactAttempts||0)+1,nextActionAt:nextAtDays(Number(cfg.commercialNoResponseDays||2),Number(cfg.commercialDefaultHour||9)),nextActionNote:x.nextActionNote||'Retomar contato — aguardando retorno.'};if((x.crmStatus||'Novo')==='Novo')patch.crmStatus='Contatado';await patchLead(id,patch,'Contato registrado e próximo follow-up agendado.')};
  window.cloud366Schedule=async function(id,days){const cfg=rulesCfg();await patchLead(id,{nextActionAt:nextAtDays(days,Number(cfg.commercialDefaultHour||9)),nextActionNote:'Follow-up comercial agendado pelo EXE PRO.'},`Follow-up agendado para +${days} dia(s).`)};
  window.cloud366ClearSchedule=async function(id){await patchLead(id,{nextActionAt:'',nextActionNote:''},'Agenda do lead concluída.')};
  window.cloud366OpenProposals=function(){openSec('proposals')};

  function automationCandidates(){const cfg=rulesCfg(),props=openProposalRows();const result=[];for(const row of rows('lead')){const x=row.payload||{};if(!isOpenLead(x)||x.nextActionAt)continue;let patch=null,reason='';if(!x.lastContactAt&&Number(x.contactAttempts||0)===0&&(x.crmStatus||'Novo')==='Novo'){patch={nextActionAt:firstContactAt(cfg.commercialFirstContactHours),nextActionNote:'Realizar primeiro contato comercial.'};reason='primeiro contato'}else if(x.lastContactAt&&Number(daysSince(x.lastContactAt)||0)>=Number(cfg.commercialNoResponseDays||2)){patch={nextActionAt:nextAtDays(0,cfg.commercialDefaultHour),nextActionNote:'Retomar contato — sem resposta registrada.'};reason='sem resposta'}else if(inactiveDays(row)>=Number(cfg.commercialStaleDays||7)){patch={nextActionAt:nextAtDays(0,cfg.commercialDefaultHour),nextActionNote:'Reativar lead parado na carteira.'};reason='lead parado'}else{const pr=props.find(p=>String(p.payload?.leadId||'')===String(row.entityId));if(pr&&proposalAge(pr)>=Number(cfg.commercialProposalDays||3)){patch={nextActionAt:nextAtDays(0,cfg.commercialDefaultHour),nextActionNote:'Retomar proposta comercial apresentada.'};reason='proposta sem retorno'}}if(patch)result.push({row,patch,reason})}return result}
  window.cloud366ApplyRules=async function(){if(!canWrite())return toast('Seu perfil está em modo somente leitura.');const cfg=rulesCfg();if(cfg.commercialAutoEnabled===false)return toast('As regras comerciais estão desativadas no Painel Mestre.');const list=automationCandidates();if(!list.length)return toast('Nenhuma agenda pendente encontrada pelas regras atuais.');if(!confirm(`Aplicar as regras comerciais em ${list.length} lead(s) sem próxima ação?\n\nNada será enviado automaticamente. Apenas a agenda comercial será criada.`))return;let ok=0,fail=0;toast('Aplicando regras comerciais...');for(const item of list){try{await patchEntity(item.row,item.patch);ok++}catch{fail++}}await refreshAll(false,true);render();toast(`${ok} agenda(s) criada(s)${fail?' · '+fail+' falha(s)':''}.`,5000)};

  window.renderCentral=function(){const st=commercialStats(),list=filteredCentralRows(),cfg=rulesCfg(),candidates=automationCandidates();const filters=[['all','Prioridades',st.active],['hot','Leads quentes',st.hot],['overdue','Atrasados',st.overdue],['today','Hoje',st.today],['nocontact','Sem contato',st.noContact],['stale','Parados',st.stale],['proposal','Propostas',st.proposals]];const cards=list.map(row=>{const x=row.payload||{},s=score(x),flags=categoryFlags(row),due=dueState(x),pr=proposalForLead(row.entityId);return `<article class="commercial366-card ${due}"><div class="commercial366-card-head"><div><div class="commercial366-flags">${flags.map(([c,t])=>`<span class="${c}">${esc(t)}</span>`).join('')}</div><h3>${esc(x.name||x.companyName||'Lead')}</h3><p>${esc([x.segment,x.city,x.state].filter(Boolean).join(' · ')||x.address||'')}</p></div><div class="commercial366-score"><b>${s}%</b><span>${esc(scoreBand(s))}</span></div></div><div class="commercial366-info"><div><label>Status</label><strong>${esc(x.crmStatus||'Novo')}</strong></div><div><label>Responsável</label><strong>${esc(x.assignedTo||'Não atribuído')}</strong></div><div><label>Tentativas</label><strong>${Number(x.contactAttempts||0)}</strong></div><div><label>Próxima ação</label><strong>${esc(dueLabel(x))}</strong></div></div><div class="commercial366-note"><b>${esc(contactLabel(row))}</b><span>${esc(x.nextActionNote|| (pr?'Proposta aguardando retorno.':'Sem observação de follow-up.'))}</span></div>${pr?`<div class="commercial366-proposal"><span>▧ Proposta aberta</span><b>${esc(pr.payload?.title||'Proposta')}</b><small>${esc(pr.payload?.status||'')}</small></div>`:''}<div class="commercial366-actions"><div><button class="btn sm client360-btn" onclick="openLead('${esc(row.entityId)}')">◎ 360°</button><button class="btn sm message-btn" onclick="cloud366GenerateMessage('${esc(row.entityId)}')">✦ Mensagem</button>${probableWhatsapp(x)?`<button class="btn sm wa-button" onclick="cloud366OpenWhatsApp('${esc(row.entityId)}')">● WhatsApp</button>`:''}</div><div><button class="btn sm" onclick="cloud366MarkContacted('${esc(row.entityId)}')">✓ Contatado</button><button class="btn sm" onclick="cloud366Schedule('${esc(row.entityId)}',1)">+1d</button><button class="btn sm" onclick="cloud366Schedule('${esc(row.entityId)}',2)">+2d</button><button class="btn sm" onclick="cloud366Schedule('${esc(row.entityId)}',7)">+7d</button>${x.nextActionAt?`<button class="btn sm" onclick="cloud366ClearSchedule('${esc(row.entityId)}')">Concluir agenda</button>`:''}</div></div></article>`}).join('');return head('CENTRAL COMERCIAL INTELIGENTE','Central Comercial','Priorize leads, registre contatos e mantenha o próximo passo sempre definido.',`<button class="btn" onclick="cloud366OpenProposals()">▧ Propostas</button>${canWrite()?`<button class="btn primary" onclick="cloud366ApplyRules()">⚡ Aplicar regras (${candidates.length})</button>`:''}`)+`<div class="commercial366-rulebar"><div><b>${cfg.commercialAutoEnabled===false?'Regras desativadas':'Regras comerciais ativas'}</b><span>${esc(ruleSummary())}</span></div>${isMaster()?'<button class="btn sm" onclick="openSec(\'master\')">Configurar no Painel Mestre</button>':''}</div><div class="commercial366-kpis"><div><b>${st.hot}</b><span>Leads quentes</span></div><div><b>${st.overdue}</b><span>Atrasados</span></div><div><b>${st.today}</b><span>Follow-ups hoje</span></div><div><b>${st.noContact}</b><span>Sem contato</span></div><div><b>${st.stale}</b><span>Leads parados</span></div><div><b>${st.proposals}</b><span>Propostas abertas</span></div></div><div class="commercial366-filters">${filters.map(([id,label,n])=>`<button class="${centralFilter===id?'active':''}" onclick="cloud366SetFilter('${id}')"><span>${esc(label)}</span><b>${n}</b></button>`).join('')}</div><div class="commercial366-grid">${cards||'<div class="card commercial366-empty">Nenhum lead encontrado neste filtro.</div>'}</div>`};

  function funnelHtml(){const leads=rows('lead').filter(r=>String(r.payload?.crmStatus||'')!=='Descartado'),props=rows('proposal'),total=leads.length,contacted=leads.filter(r=>['Contatado','Qualificado','Orçamento','Negociação','Cliente'].includes(r.payload?.crmStatus)||Number(r.payload?.contactAttempts||0)>0).length,qualified=leads.filter(r=>['Qualificado','Orçamento','Negociação','Cliente'].includes(r.payload?.crmStatus)).length,proposalIds=new Set(props.map(r=>String(r.payload?.leadId||'')).filter(Boolean)),proposals=leads.filter(r=>proposalIds.has(String(r.entityId))).length,clients=leads.filter(r=>r.payload?.crmStatus==='Cliente').length,stages=[['Prospectados',total],['Contatados',contacted],['Qualificados',qualified],['Com proposta',proposals],['Clientes',clients]];return `<div class="card commercial366-funnel"><div class="commercial366-section-title"><div><h3>Funil comercial</h3><p>Conversão da prospecção até cliente.</p></div><button class="btn sm" onclick="openSec('central')">Abrir Central Comercial</button></div><div class="commercial366-funnel-grid">${stages.map((x,i)=>{const prev=i?stages[i-1][1]:total,pct=i===0?100:(prev?Math.round(x[1]/prev*100):0);return `<div><span>${esc(x[0])}</span><b>${x[1]}</b><small>${i===0?'base atual':pct+'% da etapa anterior'}</small></div>`}).join('')}</div></div>`}
  const baseDashboard=window.renderDashboard;if(typeof baseDashboard==='function')window.renderDashboard=function(){return baseDashboard.apply(this,arguments)+funnelHtml()};

  const baseShowEntity=window.showEntityModal;if(typeof baseShowEntity==='function')window.showEntityModal=function(r){baseShowEntity.apply(this,arguments);if(r?.entityType!=='lead')return;const x=r.payload||{},body=$('modalBody');if(!body)return;const s=score(x),due=dueLabel(x),presence=[x.website?'Site':'',x.instagram?'Instagram':'',x.facebook?'Facebook':'',probableWhatsapp(x)?'WhatsApp provável':''].filter(Boolean).join(' · ')||'Sem canais confirmados';body.insertAdjacentHTML('afterbegin',`<div class="commercial366-lead360"><div><span>Lead Score</span><b>${s}%</b><small>${esc(scoreBand(s))}</small></div><div><span>Origem</span><b>${esc(x.source||'CRM')}</b><small>${esc(x.searchLabel||x.segment||'')}</small></div><div><span>Presença digital</span><b>${esc(presence)}</b><small>${Number(x.rating||0)?'★ '+Number(x.rating||0).toFixed(1)+' ('+Number(x.reviews||0)+')':''}</small></div><div><span>Agenda</span><b>${esc(due)}</b><small>${esc(x.nextActionNote||contactLabel(r))}</small></div></div><div class="commercial366-lead360-actions"><button class="btn sm message-btn" onclick="cloud366GenerateMessage('${esc(r.entityId)}')">✦ Gerar mensagem</button>${probableWhatsapp(x)?`<button class="btn sm wa-button" onclick="cloud366OpenWhatsApp('${esc(r.entityId)}')">● WhatsApp rápido</button>`:''}<button class="btn sm" onclick="cloud366MarkContacted('${esc(r.entityId)}')">✓ Marcar contatado</button><button class="btn sm" onclick="cloud366Schedule('${esc(r.entityId)}',2)">◷ Follow-up +2d</button></div>`)};

  function enhanceMasterRules(){if(S.active!=='master'||!isMaster()||$('commercialRules366'))return;const stack=document.querySelector('.master363-stack');if(!stack)return;const r=rulesCfg(),card=document.createElement('div');card.id='commercialRules366';card.className='card master363-card commercial366-master';card.innerHTML=`<h3>Central Comercial e Follow-up</h3><p class="help">Regras usadas pela Cloud para sugerir e criar agendas comerciais. Nenhuma mensagem é enviada automaticamente.</p><div class="commercial366-master-switch"><label><input id="c366Enabled" type="checkbox" ${r.commercialAutoEnabled===false?'':'checked'}> Regras comerciais ativas</label></div><div class="form-grid"><div class="field"><label>Primeiro contato (horas)</label><input id="c366FirstHours" class="input" type="number" min="1" max="72" value="${Number(r.commercialFirstContactHours||4)}"></div><div class="field"><label>Sem resposta (dias)</label><input id="c366NoResponse" class="input" type="number" min="1" max="30" value="${Number(r.commercialNoResponseDays||2)}"></div><div class="field"><label>Lead parado (dias)</label><input id="c366Stale" class="input" type="number" min="1" max="180" value="${Number(r.commercialStaleDays||7)}"></div><div class="field"><label>Proposta sem retorno (dias)</label><input id="c366Proposal" class="input" type="number" min="1" max="60" value="${Number(r.commercialProposalDays||3)}"></div><div class="field"><label>Horário padrão do follow-up</label><input id="c366Hour" class="input" type="number" min="7" max="20" value="${Number(r.commercialDefaultHour||9)}"></div></div><div class="notice" style="margin-top:12px">As regras organizam a agenda e as prioridades. O contato com o cliente continua sendo realizado e confirmado por uma pessoa.</div><div class="actions" style="margin-top:12px"><button id="c366SaveRules" class="btn primary">Salvar regras comerciais</button></div>`;const last=stack.lastElementChild;stack.insertBefore(card,last||null);$('c366SaveRules').onclick=saveRules}
  async function saveRules(){const num=(id,min,max,def)=>Math.max(min,Math.min(max,Number($(id)?.value||def)));const branding={...(S.brand||{}),commercialAutoEnabled:!!$('c366Enabled')?.checked,commercialFirstContactHours:num('c366FirstHours',1,72,4),commercialNoResponseDays:num('c366NoResponse',1,30,2),commercialStaleDays:num('c366Stale',1,180,7),commercialProposalDays:num('c366Proposal',1,60,3),commercialDefaultHour:num('c366Hour',7,20,9)};try{const j=await api('/api/web/branding',{method:'PATCH',body:JSON.stringify({branding})});applyBrand(j.branding||branding);render();toast('Regras comerciais salvas no Painel Mestre.')}catch(e){toast(e.message,5000)}}

  const baseRender=window.render;if(typeof baseRender==='function')window.render=function(){const out=baseRender.apply(this,arguments);setTimeout(enhanceMasterRules,0);return out};
  if(S.session&&S.active==='master')setTimeout(enhanceMasterRules,0);
})();
</script><script id="notifications367Script">'use strict';
(function(){
  const state={data:null,loading:false,showConfig:false};

  function role(){try{return roleRank(S.session?.user?.role||'')}catch{return 1}}
  function canOperate(){return role()>=3}
  function master(){try{return isMaster()}catch{return false}}
  function money367(v){try{return money(v)}catch{return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}}
  function date367(v){try{return day(v)}catch{return String(v||'').slice(0,10)||'—'}}
  function esc367(v){try{return esc(v)}catch{return String(v??'').replace(/[&<>"']/g,'')}}
  function statusClass(s){s=String(s||'');return /Enviado/i.test(s)?'ok':/Falh/i.test(s)?'bad':/Cancel/i.test(s)?'':'warn'}
  function kindLabel(k){
    if(k==='due')return'Vence hoje';
    if(k==='paid')return'Pagamento confirmado';
    if(/^before_/.test(k))return String(k.split('_')[1]||'')+' dia(s) antes';
    if(/^overdue_/.test(k))return String(k.split('_')[1]||'')+' dia(s) em atraso';
    return k||'Aviso';
  }
  function channelLabel(c){return c==='whatsapp'?'WhatsApp':c==='telegram'?'Telegram':c}

  const oldBuildNav=buildNav;
  buildNav=function(){
    oldBuildNav();
    const nav2=$('nav2');
    if(nav2&&!document.querySelector('[data-sec="notifications"]')){
      nav2.insertAdjacentHTML('beforeend','<button data-sec="notifications" onclick="openSec(\'notifications\')"><span class="ico">🔔</span><span>Notificações</span><span id="badge_notifications" class="badge hidden"></span></button>');
    }
    markNav();
  };

  const oldRender=render;
  render=function(){
    if(S.active==='notifications'){renderNotifications367();return}
    oldRender();
  };

  function summaryCards(d){
    const s=d?.summary||{};
    return '<div class="grid kpis notif-kpis">'+
      kpi('Agendadas',s.pending||0,'aguardando envio')+
      kpi('Vencidas agora',s.due||0,'podem ser enviadas')+

</script><script id="billing384Script">'use strict';

  function termSummary384(p){const parts=[];if(Number(p.lateFeePercent)>0)parts.push('multa '+pct384(p.lateFeePercent));if(Number(p.monthlyInterestPercent)>0)parts.push('juros '+pct384(p.monthlyInterestPercent)+'/mês');if(Number(p.earlyDiscountPercent)>0)parts.push('desconto '+pct384(p.earlyDiscountPercent));return parts.length?parts.join(' · '):'sem acréscimos/desconto'}

  function normalize(v){

  }
  function normalizePath(v){
    var p=String(v||'/').split('?')[0].split('#')[0].replace(/\/+$/,'');
    return p||'/';
  }
  function routeFromPath(path){
    var p=normalizePath(path);
    if(p==='/')return DEFAULT_ROUTE;
    for(var i=0;i<ROUTES.length;i++)if(ROUTES[i].path===p)return ROUTES[i];
    return null;
  }
  function routeFromSection(section){
    var key=normalize(section);
    for(var i=0;i<ROUTES.length;i++){
      if(ROUTES[i].sections.some(function(x){return normalize(x)===key}))return ROUTES[i];
    }
    if(DEFAULT_ROUTE.sections.some(function(x){return normalize(x)===key}))return DEFAULT_ROUTE;
    return null;
  }

    return Array.prototype.slice.call(document.querySelectorAll('#nav2 [data-sec]'));
  }
  function sectionForRoute(route){
    var buttons=navButtons();
    if(!buttons.length)return '';
    for(var i=0;i<route.sections.length;i++){
      var wanted=normalize(route.sections[i]);
      for(var j=0;j<buttons.length;j++){
        if(normalize(buttons[j].getAttribute('data-sec'))===wanted)return buttons[j].getAttribute('data-sec');
      }
    }
    for(var k=0;k<route.labels.length;k++){
      var label=normalize(route.labels[k]);
      for(var m=0;m<buttons.length;m++){
        if(normalize(buttons[m].textContent).indexOf(label)>=0)return buttons[m].getAttribute('data-sec');
      }

    if(replace)history.replaceState(state,'',next);

  function controlKey(root,el){

    if(explicit)return 'explicit:'+explicit;

    return 'index:'+Array.prototype.indexOf.call(all,el);

    if(['password','file','hidden','submit','button','reset'].indexOf(type)>=0)return false;
    if(el.tagName==='SELECT')return true;

      var el=controls[i];
      if(!eligibleControl(el))continue;
      var type=String(el.getAttribute('type')||'').toLowerCase();
      values[controlKey(root,el)]={
        type:type,
        value:(type==='checkbox'||type==='radio')?!!el.checked:String(el.value||'')
      };

      var checked=!!record.value;
      changed=el.checked!==checked;
      el.checked=checked;
    }else{
      var value=String(record.value==null?'':record.value);
      changed=String(el.value||'')!==value;
      if(changed&&el.tagName==='SELECT'){
        var option=Array.prototype.slice.call(el.options||[]).some(function(o){return String(o.value)===value});

      if(changed)el.value=value;
    }
    if(changed&&(el.tagName==='SELECT'||type==='checkbox'||type==='radio')){

  }

    try{saved=JSON.parse(raw)}catch(e){return}

    function step(){
      if(serial!==restoreSerial)return;

        setTimeout(function(){if(serial===restoreSerial)applySavedAction(saved.action)},80);

      var root=appRoot();

    }
    step();
  }
  function scheduleRestore(path){
    restoreSerial++;
    var serial=restoreSerial;
    [140,650,1400].forEach(function(delay){
      setTimeout(function(){
        if(serial===restoreSerial)applySavedState(path);
      },delay);
    });
  }
  function isSafeTabButton(el){

      document.addEventListener('change',captureChange,true);

    }
  }

    install();
    if(openWrapped)restoreFromLocation();

  else boot();

    $('content').innerHTML=head('WHATSAPP BUSINESS','Central de Conversas','Envie e receba mensagens dentro do EXE PRO pela API oficial da Meta.',actions)+
      (d?statusBanner420(d):'<div class="card"><div class="empty">Carregando WhatsApp Business...</div></div>')+
      (d?config420(d):'')+
      '<div class="grid kpis wa420-kpis">'+kpi('Conversas',s.conversations||0,'histórico local')+kpi('Não lidas',s.unread||0,'aguardando atendimento')+kpi('Webhook',d?.config?.webhookReady?'OK':'Pendente','recebimento oficial')+'</div>'+
      '<div class="notice wa420-note">Esta Central usa o número Business configurado na Meta. O WhatsApp pessoal com QR Code continua separado no botão WhatsApp Web.</div>'+
      '<div class="wa420-layout">'+(d?list420(d):'<div></div>')+(d?chat420(d):'<div></div>')+'</div>';
    const b=$('badge_whatsapp_business'),n=Number(s.unread||0);
    if(b){b.textContent=n;b.classList.toggle('hidden',!n)}
  }
  window.toggleWhatsApp420Config=function(value){W420.showConfig=!!value;render420()};
  window.loadWhatsApp420=async function(force){
    if(W420.loading)return;
    if(W420.data&&!force)return;
    W420.loading=true;
    try{W420.data=await api(api420Url());if(!W420.selectedId&&W420.data.selected)W420.selectedId=W420.data.selected.conversationId}
    catch(e){toast(e.message,7000)}
    finally{W420.loading=false;if(S.active==='whatsappBusiness')render420()}
  };
  window.selectWhatsApp420=async function(encoded){
    W420.selectedId=dec420(encoded);
    try{await api('/api/web/whatsapp/read',{method:'POST',body:JSON.stringify({conversationId:W420.selectedId})})}catch{}
    W420.data=null;await loadWhatsApp420(true);
  };
  window.createWhatsApp420=async function(){
    try{
      const phone=$('wa420_new_phone')?.value.trim(),name=$('wa420_new_name')?.value.trim();
      const j=await api('/api/web/whatsapp/conversations',{method:'POST',body:JSON.stringify({phoneNumber:phone,contactName:name})});
      W420.selectedId=j.conversation.conversationId;W420.data=null;await loadWhatsApp420(true);toast('Conversa aberta.');
    }catch(e){toast(e.message,7000)}
  };
  window.sendWhatsApp420=async function(){
    try{
      const box=$('wa420_text'),text420=box?.value.trim();if(!text420)return toast('Digite uma mensagem.');
      const j=await api('/api/web/whatsapp/messages',{method:'POST',body:JSON.stringify({conversationId:W420.selectedId,text:text420})});
      W420.selectedId=j.conversationId;W420.data=null;await loadWhatsApp420(true);toast('Mensagem enviada.');
    }catch(e){toast(e.message,8000)}
  };
  window.clearFailedWhatsApp420=async function(){
    const count=failedCount420(W420.data?.selected?.messages||[]);
    if(!W420.selectedId||!count)return toast('Não há mensagens com falha nesta conversa.');
    if(!window.confirm('Apagar somente '+count+' mensagem(ns) com falha desta conversa?'))return;
    try{
      const j=await api('/api/web/whatsapp/clear-failed',{method:'POST',body:JSON.stringify({conversationId:W420.selectedId})});
      W420.data=null;await loadWhatsApp420(true);
      toast((Number(j.deleted)||0)+' mensagem(ns) com falha apagada(s).');
    }catch(e){toast(e.message,8000)}
  };
  window.saveWhatsApp420Config=async function(){
    try{
      const j=await api('/api/web/whatsapp/config',{method:'PATCH',body:JSON.stringify({
        phoneNumberId:$('wa420_phone').value.trim(),
        graphVersion:$('wa420_graph').value.trim(),
        accessToken:$('wa420_token').value,
        verifyToken:$('wa420_verify').value,
        appSecret:$('wa420_app').value
      })});
      W420.showConfig=false;W420.data=null;await loadWhatsApp420(true);toast(j.config.configured?'Conexão do WhatsApp Business salva.':'Configuração salva; faltam credenciais para ativar.');
    }catch(e){toast(e.message,8000)}
  };
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{try{buildNav()}catch{};if(S?.session)loadWhatsApp420(true)},500));
})();</script><script id="whatsappCoexistence430Script">'use strict';
(function(){
  const W430={data:null,loading:false,state:'',sessionInfo:null,sdkPromise:null};
  function esc430(v){try{return esc(v)}catch{return String(v??'').replace(/[&<>"']/g,'')}}
  function master430(){try{return isMaster()}catch{return false}}
  function api430(path,options){return api(path,options)}
  function field430(id,label,value,placeholder){
    return'<div class="field"><label>'+esc430(label)+'</label><input id="'+id+'" class="input" value="'+esc430(value||'')+'" placeholder="'+esc430(placeholder||'')+'"></div>';
  }
  function statusText430(c){
    if(c?.connected)return'<div class="wa430-status ok"><b>Conectado por Coexistência oficial.</b><div class="wa430-detail">'+esc430(c.displayPhoneNumber||c.phoneNumberId||'Número Business conectado')+'</div></div>';
    if(c?.lastError)return'<div class="wa430-status warn"><b>Última tentativa não concluída.</b><div class="wa430-detail">'+esc430(c.lastError)+'</div></div>';
    if(c?.enabled)return'<div class="wa430-status warn"><b>Pronto para conectar.</b><div class="wa430-detail">A Meta abrirá o fluxo oficial e exibirá o QR Code para leitura no WhatsApp Business.</div></div>';
    return'<div class="wa430-status warn"><b>Configuração pendente.</b><div class="wa430-detail">Informe o Meta App ID e o Embedded Signup Config ID para habilitar o QR Code oficial.</div></div>';
  }
  function render430Card(){
    const host=$('content');if(!host||S.active!=='whatsappBusiness')return;
    const c=W430.data||{};
    const cfg=c.config||c;
    let html='<div class="card wa430-card"><div class="wa430-eyebrow">CONEXÃO OFICIAL POR QR CODE</div><h3>WhatsApp Business — Coexistência</h3><p>Conecte seu número Business existente ao EXE PRO sem substituir o aplicativo WhatsApp Business do celular.</p>'+statusText430(cfg);
    if(master430()){
      html+='<div class="wa430-grid">'+
        field430('wa430_app_id','Meta App ID',cfg.appId||'','Ex.: 123456789012345')+
        field430('wa430_config_id','Embedded Signup Config ID',cfg.configId||'','Ex.: 987654321098765')+
      '</div>'+
      '<p class="wa430-help">Esses dois identificadores não são tokens. O App Secret permanece no campo protegido da configuração oficial.</p>'+
      '<div class="wa430-actions">'+
        '<button class="btn" onclick="saveWhatsApp430Config()">Salvar configuração QR</button>'+
        '<button class="btn primary" onclick="startWhatsApp430()">Conectar por QR Code oficial</button>'+
      '</div>';
    }
    html+='<p class="wa430-help">O QR Code será exibido pela Meta durante o Embedded Signup. Não é o QR Code do WhatsApp Web pessoal.</p></div>';
    const old=host.querySelector('.wa430-card');if(old)old.outerHTML=html;else host.insertAdjacentHTML('afterbegin',html);
  }
  async function loadMetaSdk430(appId,version){
    if(window.FB){try{window.FB.init({appId,autoLogAppEvents:false,xfbml:false,version:version||'v23.0'})}catch{};return window.FB}
    if(W430.sdkPromise)return W430.sdkPromise;
    W430.sdkPromise=new Promise((resolve,reject)=>{
      const previous=window.fbAsyncInit;
      window.fbAsyncInit=function(){try{window.FB.init({appId,autoLogAppEvents:false,xfbml:false,version:version||'v23.0'});resolve(window.FB)}catch(error){reject(error)}finally{if(previous)try{previous()}catch{}}};
      const script=document.createElement('script');
      script.async=true;script.defer=true;script.crossOrigin='anonymous';script.src='https://connect.facebook.net/pt_BR/sdk.js';
      script.onload=()=>setTimeout(()=>{if(!window.FB)reject(new Error('SDK da Meta não carregou.'))},5000);
      script.onerror=()=>reject(new Error('Não foi possível carregar o SDK da Meta.'));
      document.head.appendChild(script);
    });
    return W430.sdkPromise;
  }
  function parse430(value){
    if(value&&typeof value==='object')return value;
    if(typeof value==='string'){try{return JSON.parse(value)||{}}catch{}}
    return{};
  }
  function find430(root,keys){
    const wanted=new Set(keys),queue=[parse430(root)],seen=new Set();
    while(queue.length){
      const item=queue.shift();if(!item||typeof item!=='object'||seen.has(item))continue;seen.add(item);
      for(const key of wanted){if(item[key]!==undefined&&item[key]!==null&&String(item[key]).trim())return String(item[key]).trim()}
      for(const value of Object.values(item))if(value&&typeof value==='object')queue.push(value);
    }
    return'';
  }
  function capture430(event){
    if(event.origin!=='https://www.facebook.com'&&event.origin!=='https://web.facebook.com')return;
    const data=parse430(event.data);
    if(data.type!=='WA_EMBEDDED_SIGNUP')return;
    W430.sessionInfo=data.data||data;
    render430Card();
  }
  if(!window.__wa430MessageListener){window.__wa430MessageListener=true;window.addEventListener('message',capture430)}
  async function prepare430(){
    if(!W430.data?.config?.enabled||!master430())return;
    try{
      const start=await api430('/api/web/whatsapp/coexistence/start',{method:'POST',body:'{}'});
      W430.state=start.state||'';
      await loadMetaSdk430(W430.data.config.appId,W430.data.config.graphVersion);
    }catch(error){W430.prepareError=error.message||String(error)}
  }
  window.loadWhatsApp430=async function(force){
    if(W430.loading)return;
    if(W430.data&&!force){render430Card();return}
    W430.loading=true;
    try{W430.data=await api430('/api/web/whatsapp/coexistence/config');await prepare430()}
    catch(error){W430.data={config:{lastError:error.message||String(error)}}}
    finally{W430.loading=false;render430Card()}
  };
  window.saveWhatsApp430Config=async function(){
    try{
      const appId=$('wa430_app_id')?.value.trim(),configId=$('wa430_config_id')?.value.trim();
      const result=await api430('/api/web/whatsapp/coexistence/config',{method:'PATCH',body:JSON.stringify({appId,configId})});
      W430.data=result;await prepare430();render430Card();toast('Configuração do QR Code oficial salva.');
    }catch(error){toast(error.message||String(error),8000)}
  };
  window.startWhatsApp430=async function(){
    try{
      if(!W430.data)await loadWhatsApp430(true);
      const cfg=W430.data?.config||W430.data;
      if(!cfg?.enabled)throw new Error('Salve primeiro o Meta App ID e o Embedded Signup Config ID.');
      if(!W430.state){
        const start=await api430('/api/web/whatsapp/coexistence/start',{method:'POST',body:'{}'});
        W430.state=start.state||'';
      }
      const fb=await loadMetaSdk430(cfg.appId,cfg.graphVersion);
      if(!fb?.login)throw new Error('SDK da Meta não está disponível.');
      W430.sessionInfo=null;
      fb.login(function(response){
        (async function(){
          try{
          const code=response?.authResponse?.code||'';
          const accessToken=response?.authResponse?.accessToken||'';
          if(!code&&!accessToken)throw new Error('A autorização do WhatsApp Business foi cancelada ou não retornou código.');
          const result=await api430('/api/web/whatsapp/coexistence/complete',{method:'POST',body:JSON.stringify({state:W430.state,code,accessToken,sessionInfo:W430.sessionInfo})});
          W430.data=result;W430.state='';toast('WhatsApp Business conectado por QR Code oficial.');render430Card();
          }catch(error){toast(error.message||String(error),10000);W430.data={config:{lastError:error.message||String(error)}};render430Card()}
        })();
      },{
        config_id:cfg.configId,
        response_type:'code',
        override_default_response_type:true,
        extras:{
          setup:{},
          featureType:'whatsapp_business_app_onboarding',
          sessionInfoVersion:'3'
        }
      });
    }catch(error){toast(error.message||String(error),9000)}
  };
  const oldRender430=render;
  render=function(){
    oldRender430();
    if(S.active==='whatsappBusiness')setTimeout(render430Card,0);
  };
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{try{if(S?.session)loadWhatsApp430(true)}catch{}},700));
})();</script></body></html>

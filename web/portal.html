<style>
:root{--accent:#18b7a4;--bg:#090a0c;--panel:#111318;--panel2:#171a20;--line:#292d35;--text:#f7f8fa;--muted:#969daa;--danger:#ff7b86;--warn:#f2bd63;--ok:#57d6a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
a{color:var(--accent)}.hidden{display:none!important}
#loginView{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 35%),linear-gradient(150deg,#07080a,#101319 60%,#090a0d)}
.login-card{width:min(440px,100%);background:rgba(17,19,24,.92);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-mark{width:44px;height:44px;border-radius:13px;background:var(--accent);color:#06110f;display:grid;place-items:center;font-weight:1000;letter-spacing:-.05em}.brand-copy b{display:block;font-size:17px}.brand-copy span{font-size:11px;color:var(--muted)}
.eyebrow{font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}h1{font-size:28px;line-height:1.05;margin:7px 0 8px}p{color:var(--muted);line-height:1.55}.field{margin-top:13px}.field label{display:block;font-size:9px;font-weight:900;letter-spacing:.08em;color:#b3bac4;margin-bottom:6px}.input{width:100%;border:1px solid var(--line);background:#0c0e12;color:var(--text);border-radius:11px;padding:12px 13px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.btn{border:1px solid var(--line);background:#15181e;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:850;font-size:11px}.btn:hover{border-color:#454b56}.btn.primary{background:var(--accent);color:#07110f;border-color:var(--accent)}.btn.full{width:100%;margin-top:16px;padding:13px}
.error{margin-top:12px;color:#ffc0c5;background:#221316;border:1px solid #663039;padding:10px 12px;border-radius:10px;font-size:11px}
#appView{min-height:100vh}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(9,10,12,.92);backdrop-filter:blur(14px);z-index:20}.topbar-left{display:flex;align-items:center;gap:18px}.topbar .brand{margin:0}.client-chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:#c7ccd4;background:#101217}.topbar-right{display:flex;align-items:center;gap:8px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{border-right:1px solid var(--line);padding:18px 12px;background:#0b0d10}.navbtn{width:100%;border:0;background:transparent;color:#a9b0ba;padding:11px 12px;border-radius:10px;text-align:left;font-weight:850;font-size:11px;margin-bottom:4px}.navbtn:hover,.navbtn.active{background:#171a20;color:#fff}.navbtn.active{box-shadow:inset 3px 0 0 var(--accent)}.sidebar-foot{margin-top:24px;padding:12px;color:var(--muted);font-size:10px;line-height:1.5}
.main{padding:24px;max-width:1500px;width:100%;margin:0 auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}.hero h2{font-size:27px;margin:4px 0 6px}.hero p{margin:0}.status{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:9px;font-weight:900;background:#13161b}.status.ok{color:var(--ok);border-color:#265b47}.status.warn{color:var(--warn);border-color:#625126}.status.bad{color:var(--danger);border-color:#67333a}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi{background:linear-gradient(180deg,#15181e,#101217);border:1px solid var(--line);border-radius:15px;padding:16px}.kpi span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted)}.kpi b{display:block;font-size:24px;margin-top:8px}.kpi small{color:#7f8793}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.card h3{font-size:15px;margin:0}.muted{color:var(--muted)}.tiny{font-size:9px}.section-title{font-size:19px;margin:0 0 15px}.rows{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row-main b{font-size:12px}.row-main div{font-size:10px;color:var(--muted);margin-top:4px}.row-side{text-align:right}.row-side b{font-size:12px}.row-side div{font-size:9px;color:var(--muted);margin-top:4px}
.service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.service-card,.project-card,.site-card{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px}.service-card h4,.project-card h4,.site-card h4{margin:0 0 5px;font-size:13px}.service-price{font-size:18px;font-weight:950;margin-top:12px}.site-link{font-size:10px;overflow-wrap:anywhere}.progress{height:8px;border-radius:999px;background:#292d35;overflow:hidden;margin:12px 0 5px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:12px 11px;border-bottom:1px solid #22262d;font-size:11px}.table tr:last-child td{border-bottom:0}.amount{font-weight:900}.overdue{color:var(--danger)}.empty{padding:32px;text-align:center;color:var(--muted)}
.support{display:flex;gap:8px;flex-wrap:wrap}.support a{text-decoration:none}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.topbar{padding:0 14px}.client-chip{display:none}.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:5px;overflow:auto;padding:8px}.sidebar-foot{display:none}.navbtn{width:auto;white-space:nowrap;margin:0}.main{padding:16px}.hero{align-items:flex-start;flex-direction:column}.service-grid{grid-template-columns:1fr}}
</style>

</style><style id="pp452Style">.pp452-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.pp452-lead{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}.pp452-photo-wrap{position:relative;height:150px;background:#0b0d11}.pp452-photo{width:100%;height:100%;object-fit:cover;display:block}.pp452-photo-empty{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#151922,#0e1116)}.pp452-photo-empty span{font-size:30px;font-weight:900;color:color-mix(in srgb,var(--accent) 65%,#5b6472);letter-spacing:-.04em}.pp452-lead-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}.pp452-lead-body h4{margin:0;font-size:14px;line-height:1.3}.pp452-addr{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45}.pp452-tags{display:flex;gap:6px;flex-wrap:wrap}.pp452-tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 9px;background:var(--panel)}.pp452-tag-star{color:#f2bd63;border-color:rgba(242,189,99,.35)}.pp452-tag-hot{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}.pp452-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:4px}.pp452-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel2)}.pp452-card h4{margin:2px 0 6px;font-size:14px}.pp452-card p{margin:0 0 4px;font-size:12px;color:var(--muted);line-height:1.45}.pp452-card .pp452-src{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.pp452-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pp452-msg{padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:12px;margin-top:12px}.pp452-msg.ok{border-color:rgba(87,214,160,.4);color:var(--ok)}.pp452-msg.warn{border-color:rgba(242,189,99,.4);color:var(--warn)}.pp452-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.pp452-form .pp452-wide{grid-column:1/-1}@media(max-width:760px){.pp452-grid,.pp452-form{grid-template-columns:1fr}}</style></head>
<body>
<section id="loginView">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">EX</div><div class="brand-copy"><b id="loginBrand">Portal do Cliente</b><span>Área segura EXE PRO</span></div></div>
    <div class="eyebrow">ACESSO DO CLIENTE</div>
    <h1>Bem-vindo</h1>
    <p>Acompanhe seus serviços, sites, cobranças e projetos em um único lugar.</p>
    <form id="loginForm">
      <div class="field"><label>USUÁRIO / E-MAIL</label><input id="loginUser" class="input" autocomplete="username" required></div>
      <div class="field"><label>SENHA</label><input id="loginPass" class="input" type="password" autocomplete="current-password" required></div>
      <button class="btn primary full" type="submit">Entrar no portal</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>

<section id="appView" class="hidden">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand"><div class="brand-mark">EX</div><div class="brand-copy"><b id="brandName">Portal do Cliente</b><span id="brandSub">EXE PRO</span></div></div>
      <span id="clientChip" class="client-chip"></span>
    </div>
    <div class="topbar-right"><span id="userChip" class="client-chip"></span><button id="logoutBtn" class="btn">Sair</button></div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <button class="navbtn active" data-page="dashboard">Visão geral</button>
      <button class="navbtn" data-page="services">Serviços e sites</button>
      <button class="navbtn" data-page="finance" id="financeNav">Financeiro</button>
      <button class="navbtn" data-page="projects" id="projectsNav">Projetos</button>
      <div class="sidebar-foot">Portal exclusivo do cliente. Informações administrativas internas do EXE PRO não são exibidas aqui.</div>
    </aside>
    <main id="main" class="main"></main>
  </div>
</section>

<script>
const P={csrf:'',data:null,page:'dashboard'};
const $=id=>document.getElementById(id);
function e(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function date(v){if(!v)return'—';const s=String(v).slice(0,10),p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function roleLabel(v){return({Proprietario:'Proprietário',Financeiro:'Financeiro',Marketing:'Marketing',Visualizador:'Visualizador'})[v]||v}
async function api(url,opt={}){
  const o={credentials:'same-origin',headers:{'content-type':'application/json',...(opt.headers||{})},...opt};
  if(P.csrf&&o.method&&o.method!=='GET')o.headers['x-csrf-token']=P.csrf;
  const r=await fetch(url,o);let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw new Error(j.error||'Falha na comunicação.');
  return j;
}
function applyBrand(){
  const b=P.data?.branding||{};
  if(/^#[0-9a-f]{6}$/i.test(b.accent||''))document.documentElement.style.setProperty('--accent',b.accent);
  $('brandName').textContent=b.name||'Portal do Cliente';$('loginBrand').textContent=b.name||'Portal do Cliente';
}
function nav(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===P.page));
  $('financeNav').classList.toggle('hidden',!P.data?.permissions?.finance);
  $('projectsNav').classList.toggle('hidden',!P.data?.permissions?.projects);
}
function statusBadge(v){
  const s=String(v||'');let cls=/ativo|online|pago|conclu/i.test(s)?'ok':/atras|susp|erro|cancel/i.test(s)?'bad':'warn';
  return'<span class="status '+cls+'">'+e(s||'—')+'</span>';
}
function support(){
  const b=P.data.branding||{},arr=[];
  if(b.supportWhatsapp){const d=String(b.supportWhatsapp).replace(/\D+/g,'');arr.push('<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+e(d)+'">WhatsApp</a>')}
  if(b.supportEmail)arr.push('<a class="btn" href="mailto:'+e(b.supportEmail)+'">E-mail</a>');
  return arr.length?'<div class="support">'+arr.join('')+'</div>':'<span class="muted tiny">Contato de suporte não informado.</span>';
}
function dashboard(){
  const d=P.data,c=d.client,s=d.summary;
  return'<div class="hero"><div><div class="eyebrow">PORTAL DO CLIENTE</div><h2>Olá, '+e(c.name)+'</h2><p>Veja um resumo dos seus serviços e da operação atual.</p></div>'+statusBadge(c.status)+'</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><span>Serviços ativos</span><b>'+e(s.services)+'</b><small>contratados</small></div>'+
      '<div class="kpi"><span>Sites</span><b>'+e(s.sites)+'</b><small>monitorados</small></div>'+
      '<div class="kpi"><span>'+(d.permissions.finance?'Mensalidade':'Projetos')+'</span><b>'+(d.permissions.finance?money(s.monthly):e(s.projects))+'</b><small>'+(d.permissions.finance?'serviços mensais':'em acompanhamento')+'</small></div>'+
      '<div class="kpi"><span>'+(d.permissions.finance?'Próximo vencimento':'Status')+'</span><b>'+(d.permissions.finance?date(s.nextDue):e(c.status))+'</b><small>'+(d.permissions.finance?(s.nextAmount!=null?money(s.nextAmount):'sem cobrança'):'situação da conta')+'</small></div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card"><div class="card-head"><div><div class="eyebrow">SERVIÇOS</div><h3>Carteira atual</h3></div><button class="btn" onclick="go(\'services\')">Ver tudo</button></div>'+servicesMini()+'</div>'+
      '<div class="card"><div class="card-head"><div><div class="eyebrow">SUPORTE</div><h3>Fale com a equipe</h3></div></div><p>Precisa falar sobre um serviço, site ou cobrança?</p>'+support()+'</div>'+
    '</div>'+
    (d.permissions.finance?'<div class="card"><div class="card-head"><div><div class="eyebrow">FINANCEIRO</div><h3>Situação financeira</h3></div><button class="btn" onclick="go(\'finance\')">Abrir financeiro</button></div><div class="kpis" style="margin-bottom:0"><div class="kpi"><span>Em aberto</span><b>'+money(s.pending)+'</b></div><div class="kpi"><span>Em atraso</span><b class="'+(s.overdue>0?'overdue':'')+'">'+money(s.overdue)+'</b></div></div></div>':'');
}
function servicesMini(){
  const a=(P.data.services||[]).filter(x=>x.status==='Ativo').slice(0,4);
  if(!a.length)return'<div class="empty">Nenhum serviço ativo cadastrado.</div>';
  return'<div class="rows">'+a.map(x=>'<div class="row"><div class="row-main"><b>'+e(x.name)+'</b><div>'+e(x.siteUrl||'Serviço geral')+'</div></div><div class="row-side"><b>'+(x.price==null?'—':money(x.price))+'</b><div>'+e(x.billingCycle)+'</div></div></div>').join('')+'</div>';
}
function servicesPage(){
  const sv=P.data.services||[],sites=P.data.sites||[];
  return'<div class="hero"><div><div class="eyebrow">SERVIÇOS E SITES</div><h2>Sua estrutura contratada</h2><p>Serviços, valores, periodicidade e sites vinculados.</p></div></div>'+
    '<h3 class="section-title">Serviços</h3>'+
    (sv.length?'<div class="service-grid">'+sv.map(x=>'<article class="service-card"><div class="card-head"><div><h4>'+e(x.name)+'</h4><div class="tiny muted">'+e(x.siteUrl||'Serviço geral')+'</div></div>'+statusBadge(x.status)+'</div><div class="service-price">'+(x.price==null?'Valor reservado':money(x.price))+'</div><div class="tiny muted">'+e(x.billingCycle)+' · vencimento dia '+e(x.billingDay)+'</div></article>').join('')+'</div>':'<div class="card empty">Nenhum serviço cadastrado.</div>')+
    '<h3 class="section-title" style="margin-top:22px">Sites</h3>'+
    (sites.length?'<div class="service-grid">'+sites.map(x=>'<article class="site-card"><div class="card-head"><div><h4>'+e(x.label)+'</h4><a class="site-link" target="_blank" rel="noopener" href="'+e(x.siteUrl)+'">'+e(x.siteUrl)+'</a></div>'+statusBadge(x.status)+'</div><div class="tiny muted">Última verificação: '+date(x.lastCheckedAt)+'</div></article>').join('')+'</div>':'<div class="card empty">Nenhum site conectado ao portal.</div>');
}
function financePage(){
  if(!P.data.permissions.finance)return dashboard();
  const a=P.data.finance||[];
  return'<div class="hero"><div><div class="eyebrow">FINANCEIRO</div><h2>Faturas e pagamentos</h2><p>Acompanhe cobranças abertas, vencidas e pagas.</p></div></div>'+
    '<div class="kpis"><div class="kpi"><span>Em aberto</span><b>'+money(P.data.summary.pending)+'</b></div><div class="kpi"><span>Em atraso</span><b class="'+(P.data.summary.overdue>0?'overdue':'')+'">'+money(P.data.summary.overdue)+'</b></div><div class="kpi"><span>Próximo vencimento</span><b>'+date(P.data.summary.nextDue)+'</b><small>'+money(P.data.summary.nextAmount)+'</small></div><div class="kpi"><span>PIX</span><b style="font-size:13px;overflow-wrap:anywhere">'+e(P.data.branding?.pixKey||'Não informado')+'</b></div></div>'+
    (a.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Pagamento</th><th>Status</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+e(x.description)+'</b></td><td class="'+(x.overdue?'overdue':'')+'">'+date(x.dueDate)+'</td><td class="amount">'+money(x.amount)+'</td><td>'+e(x.paymentMethod||'—')+'</td><td>'+statusBadge(x.overdue?'Atrasado':x.status)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card empty">Nenhuma cobrança cadastrada.</div>');
}
function projectsPage(){
  if(!P.data.permissions.projects)return dashboard();
  const a=P.data.projects||[];
  return'<div class="hero"><div><div class="eyebrow">PROJETOS</div><h2>Andamento dos projetos</h2><p>Acompanhe status, prazo e percentual concluído.</p></div></div>'+
    (a.length?'<div class="service-grid">'+a.map(x=>'<article class="project-card"><div class="card-head"><div><h4>'+e(x.title)+'</h4><div class="tiny muted">'+e(x.deadline?'Prazo: '+date(x.deadline):'Sem prazo definido')+'</div></div>'+statusBadge(x.status)+'</div><p class="tiny">'+e(x.summary||'Sem atualização pública registrada.')+'</p><div class="progress"><span style="width:'+Math.max(0,Math.min(100,x.progress||0))+'%"></span></div><div class="tiny muted">'+e(x.progress||0)+'% concluído</div></article>').join('')+'</div>':'<div class="card empty">Nenhum projeto em acompanhamento.</div>');
}
function render(){
  if(!P.data)return;
  nav();
  $('clientChip').textContent=P.data.client.name;
  $('userChip').textContent=P.data.user.username+' · '+roleLabel(P.data.user.role);
  $('main').innerHTML=P.page==='services'?servicesPage():P.page==='finance'?financePage():P.page==='projects'?projectsPage():dashboard();
}
function go(page){P.page=page;render()}window.go=go;
async function load(){
  try{
    const s=await api('/api/portal/session');P.csrf=s.csrf;
    P.data=await api('/api/portal/dashboard');P.csrf=P.data.csrf||P.csrf;applyBrand();
    $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');render();
  }catch{$('loginView').classList.remove('hidden');$('appView').classList.add('hidden')}
}
$('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();const err=$('loginError');err.classList.add('hidden');
  try{
    const j=await api('/api/portal/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});
    P.csrf=j.csrf;await load();
  }catch(e){err.textContent=e.message;err.classList.remove('hidden')}
});
$('logoutBtn').addEventListener('click',async()=>{try{await api('/api/portal/logout',{method:'POST',body:'{}'})}catch{}P.data=null;P.csrf='';$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('loginPass').value=''});
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
load();
</script>
<script id="portalClientOps381Script">'use strict';
(function(){
  const OP381={loading:false};
  const baseRender381=render;
  const baseDashboard381=dashboard;
  const baseFinance381=financePage;

  function bytes381(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
  function typeLabel381(t){return({Chamado:'Chamado',Arquivo:'Arquivo',Projeto:'Projeto',Financeiro:'Financeiro',Comprovante:'Comprovante'})[t]||t}
  function ticketStatus381(s){return statusBadge(s)}
  function safeDownload381(id){return'/api/portal/files/'+encodeURIComponent(id)+'/download'}
  function categoryLabel381(v){return v==='Conteudo'?'Conteúdo':v}

  async function loadOps381(force=false){
    if(OP381.loading)return P.ops;
    if(P.ops&&!force)return P.ops;
    OP381.loading=true;
    try{P.ops=await api('/api/portal/operations');P.csrf=P.ops.csrf||P.csrf;updateOpsBadges381();return P.ops}
    catch(e){console.error(e);return null}
    finally{OP381.loading=false}
  }
  window.loadOps381=loadOps381;

  function ensureNav381(){
    const side=document.querySelector('.sidebar');if(!side||document.getElementById('ticketsNav381'))return;
    const foot=side.querySelector('.sidebar-foot');
    const html='<button class="navbtn" data-page="tickets" id="ticketsNav381" onclick="goOps381(\'tickets\')">Chamados <span id="ticketBadge381" class="op381-badge hidden"></span></button>'+
      '<button class="navbtn" data-page="files" id="filesNav381" onclick="goOps381(\'files\')">Arquivos</button>'+
      '<button class="navbtn" data-page="timeline" id="timelineNav381" onclick="goOps381(\'timeline\')">Linha do tempo</button>';
    if(foot)foot.insertAdjacentHTML('beforebegin',html);else side.insertAdjacentHTML('beforeend',html);
  }
  function updateOpsBadges381(){
    const b=document.getElementById('ticketBadge381'),n=Number(P.ops?.counts?.openTickets||0);
    if(b){b.textContent=n;b.classList.toggle('hidden',!n)}
  }
  window.goOps381=async function(page){
    ensureNav381();
    P.page=page;
    await loadOps381(false);
    render();
  };

  dashboard=function(){
    let h=baseDashboard381();
    if(!P.ops)setTimeout(()=>loadOps381(false).then(()=>{if(P.page==='dashboard')render()}),0);
    const o=P.ops;
    if(!o)return h;
    h+='<div class="card op381-dashboard"><div class="card-head"><div><div class="eyebrow">ATENDIMENTO</div><h3>Portal operacional</h3></div><button class="btn" onclick="goOps381(\'tickets\')">Abrir chamados</button></div>'+
      '<div class="op381-mini-grid"><div><span>Chamados abertos</span><b>'+e(o.counts?.openTickets||0)+'</b></div><div><span>Arquivos compartilhados</span><b>'+e(o.counts?.files||0)+'</b></div>'+
      (P.data.permissions.finance?'<div><span>Comprovantes aguardando</span><b>'+e(o.counts?.pendingProofs||0)+'</b></div>':'')+
      '<div><span>Última movimentação</span><b class="op381-date">'+e(o.timeline?.[0]?date(o.timeline[0].at):'—')+'</b></div></div></div>';
    return h;
  };

  financePage=function(){
    let h=baseFinance381();
    if(!P.data.permissions.finance)return h;
    if(!P.ops)setTimeout(()=>loadOps381(false).then(()=>{if(P.page==='finance')render()}),0);
    const proofs=P.ops?.proofs||[];
    const open=(P.data.finance||[]).filter(x=>!String(x.status||'').toLowerCase().includes('pago')&&!String(x.status||'').toLowerCase().includes('cancel'));
    h+='<div class="card op381-proof-card"><div class="card-head"><div><div class="eyebrow">COMPROVANTES</div><h3>Comprovantes de pagamento</h3><p class="muted tiny">Envie um comprovante para conferência da equipe.</p></div>'+(open.length?'<button class="btn primary" onclick="openProof381()">+ Enviar comprovante</button>':'')+'</div>'+
      (proofs.length?'<div class="rows">'+proofs.map(x=>'<div class="row"><div class="row-main"><b>'+e(x.filename)+'</b><div>'+e(x.receivable?.description||'Cobrança')+' · '+date(x.submittedAt)+'</div></div><div class="row-side">'+statusBadge(x.status)+'<div><a href="'+safeDownload381(x.fileId)+'">Baixar</a></div></div></div>').join('')+'</div>':'<div class="empty">Nenhum comprovante enviado.</div>')+
    '</div>';
    return h;
  };

  function ticketsPage381(){
    const a=P.ops?.tickets||[];
    return'<div class="hero"><div><div class="eyebrow">ATENDIMENTO</div><h2>Chamados</h2><p>Solicite alterações, suporte, SEO, conteúdo ou atendimento financeiro.</p></div><button class="btn primary" onclick="openTicketCreate381()">+ Novo chamado</button></div>'+
      '<div class="kpis op381-kpis"><div class="kpi"><span>Abertos</span><b>'+e(P.ops?.counts?.openTickets||0)+'</b></div><div class="kpi"><span>Total</span><b>'+a.length+'</b></div><div class="kpi"><span>Arquivos</span><b>'+e(P.ops?.counts?.files||0)+'</b></div><div class="kpi"><span>Última atividade</span><b style="font-size:15px">'+e(P.ops?.timeline?.[0]?date(P.ops.timeline[0].at):'—')+'</b></div></div>'+
      (a.length?'<div class="op381-ticket-list">'+a.map(t=>'<article class="card op381-ticket"><div class="card-head"><div><div class="eyebrow">'+e(categoryLabel381(t.category))+' · '+e(t.priority)+'</div><h3>'+e(t.subject)+'</h3><p class="muted tiny">Atualizado em '+date(t.updatedAt)+' · '+(t.messages?.length||0)+' mensagem(ns)</p></div>'+ticketStatus381(t.status)+'</div><p>'+e(t.description)+'</p><div class="op381-ticket-foot"><span class="tiny muted">'+(t.assignedTo?'Responsável: '+e(t.assignedTo):'Aguardando distribuição')+'</span><button class="btn" onclick="openTicket381(\''+e(t.ticketId)+'\')">Abrir conversa</button></div></article>').join('')+'</div>':'<div class="card empty">Você ainda não abriu nenhum chamado.</div>');
  }

  function filesPage381(){
    const a=P.ops?.files||[];
    return'<div class="hero"><div><div class="eyebrow">ARQUIVOS</div><h2>Arquivos compartilhados</h2><p>Contratos, relatórios, briefings, imagens e documentos trocados com a equipe.</p></div><button class="btn primary" onclick="openFileUpload381()">+ Enviar arquivo</button></div>'+
      '<div class="notice op381-file-note">Arquivos permitidos: PDF, JPG, PNG, WEBP, TXT, ZIP, DOCX e XLSX. Limite de 8 MB por arquivo.</div>'+
      (a.length?'<div class="service-grid">'+a.map(f=>'<article class="service-card op381-file"><div class="card-head"><div><h4>'+e(f.filename)+'</h4><div class="tiny muted">'+e(f.category)+' · '+bytes381(f.byteSize)+'</div></div><span class="status">'+date(f.createdAt)+'</span></div><div class="tiny muted">Enviado por '+e(f.uploadedByName||f.uploadedByType)+'</div><div style="margin-top:12px"><a class="btn" href="'+safeDownload381(f.fileId)+'">Baixar arquivo</a></div></article>').join('')+'</div>':'<div class="card empty">Nenhum arquivo compartilhado ainda.</div>');
  }

  function timelinePage381(){
    const a=P.ops?.timeline||[];

(function(){
  const PP452={loading:false,data:null,saved:{}};
  const PP452_REGIONS=[{"name":"Guaratiba","cities":["Rio de Janeiro"]},{"name":"Barra da Tijuca","cities":["Rio de Janeiro"]},{"name":"Recreio dos Bandeirantes","cities":["Rio de Janeiro"]},{"name":"Jacarepaguá","cities":["Rio de Janeiro"]},{"name":"Campo Grande","cities":["Rio de Janeiro"]},{"name":"Santa Cruz","cities":["Rio de Janeiro"]},{"name":"Zona Sul RJ","cities":["Rio de Janeiro"]},{"name":"Centro RJ","cities":["Rio de Janeiro"]},{"name":"Zona Norte RJ","cities":["Rio de Janeiro"]},{"name":"Baixada Fluminense","cities":["Duque de Caxias","Nova Iguaçu","Belford Roxo","São João de Meriti","Queimados","Japeri","Mesquita","Nilópolis","Magé","Seropédica"]},{"name":"Grande Niterói","cities":["Niterói","São Gonçalo","Maricá","Itaboraí"]},{"name":"Região dos Lagos","cities":["Cabo Frio","Armação dos Búzios","São Pedro da Aldeia","Iguaba Grande","Saquarema","Araruama","Arraial do Cabo"]}];
  const baseDashboard452=dashboard;
  const baseRender452=render;
  function isOwner452(){return String(P.data?.user?.role||'').toLowerCase()==='proprietario'}
  function waLink452(phone){let d=String(phone||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('55')&&(d.length===12||d.length===13))return d;if(d.length===10||d.length===11)return'55'+d;return d}
  function ppMsg452(text,kind){const m=document.getElementById('pp452Msg');if(m){m.textContent=text;m.className='pp452-msg'+(kind?' '+kind:'')}}
  function ensureProsNav452(){
    const side=document.querySelector('.sidebar');if(!side)return;
    if(!isOwner452()){const b=document.getElementById('portalPros452');if(b)b.remove();return}
    if(document.getElementById('portalPros452'))return;
    const foot=side.querySelector('.sidebar-foot');
    const html='<button class="navbtn" data-page="prospecting" id="portalPros452" onclick="goPortalPros452()">Prospecção</button>';
    if(foot)foot.insertAdjacentHTML('beforebegin',html);else side.insertAdjacentHTML('beforeend',html);
  }
  window.goPortalPros452=async function(){P.page='prospecting';PP452.data=PP452.data||{ok:false};render()};
  window.ppRegionChanged452=function(){
    const v=document.getElementById('pp452Region')?.value||'';
    document.getElementById('pp452RegionCustom')?.classList.toggle('hidden',v!=='__custom__');
    const sel=document.getElementById('pp452City');if(!sel)return;
    const r=PP452_REGIONS.find(function(x){return x.name===v});
    sel.innerHTML=r?r.cities.map(function(c){return '<option>'+c+'</option>'}).join('')+'<option value="__custom__">Outra (digitar)</option>':'<option value="">— Selecione a região primeiro —</option>';
    document.getElementById('pp452CityCustom')?.classList.add('hidden');
  };
  window.ppCityChanged452=function(){document.getElementById('pp452CityCustom')?.classList.toggle('hidden',(document.getElementById('pp452City')?.value||'')!=='__custom__')};
  async function ppRun452(){
    const seg=String(document.getElementById('pp452Seg')?.value||'').trim();
    if(!seg){ppMsg452('Informe o segmento para buscar empresas.','warn');return}
    const body={
      segment:seg,
      region:(function(){const s=document.getElementById('pp452Region');const v=s?s.value:'';return v==='__custom__'?String(document.getElementById('pp452RegionCustom')?.value||'').trim():String(v).trim()})(),
      city:(function(){const s=document.getElementById('pp452City');const v=s?s.value:'';return v==='__custom__'?String(document.getElementById('pp452CityCustom')?.value||'').trim():String(v).trim()})(),
      state:String(document.getElementById('pp452State')?.value||'').trim(),
      limit:Number(document.getElementById('pp452Limit')?.value||20),
      sources:[['maps','pp452Maps'],['google','pp452Google'],['instagram','pp452Insta'],['facebook','pp452Face']].filter(x=>document.getElementById(x[1])?.checked).map(x=>x[0])
    };
    if(!body.sources.length){ppMsg452('Selecione ao menos uma fonte de busca.','warn');return}
    PP452.loading=true;ppMsg452('Pesquisando empresas...');
    try{
      const j=await api('/api/portal/prospect',{method:'POST',body:JSON.stringify(body)});
      if(!j.ok)throw new Error(j.error||'Falha na busca.');
      PP452.data=j;PP452.saved={};ppMsg452('');
      const el=document.getElementById('pp452Results');if(el)el.innerHTML=ppResults452();
      ppMsg452('Pesquisa concluída'+(j.warnings&&j.warnings.length?' · '+j.warnings.join(' | '):''),'ok');
    }catch(err){ppMsg452(err.message||'Falha na busca.','warn')}
    finally{PP452.loading=false}
  }
  window.ppRun452=ppRun452;
  function ppWebCard452(x){
    return '<article class="pp452-card"><div class="pp452-src">'+e(String(x.source||'WEB').toUpperCase())+'</div><h4>'+e(x.name||'')+'</h4><p>'+e(x.snippet||'')+'</p>'+
      (x.link?'<div class="pp452-actions"><a class="btn" target="_blank" rel="noopener" href="'+e(x.link)+'">Abrir resultado</a></div>':'')+'</article>';
  }
  function ppPhoto452(x){
    const ph=x.photoName||'';
    const letter=e(String(x.category||x.name||'P').slice(0,1).toUpperCase());
    if(!ph)return'<div class="pp452-photo-wrap"><div class="pp452-photo-empty"><span>'+letter+'</span></div></div>';
    return'<div class="pp452-photo-wrap"><img class="pp452-photo" loading="lazy" alt="" src="/api/portal/place-photo?name='+encodeURIComponent(ph)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="pp452-photo-empty" style="display:none"><span>'+letter+'</span></div></div>';
  }
  function ppMapCard452(x,i){
    const key=x.placeId||(x.name+'|'+x.address);
    const done=!!PP452.saved[key];
    const wa=waLink452(x.phone);
    const tags=[];
    if(x.category)tags.push('<span class="pp452-tag">'+e(x.category)+'</span>');
    if(Number(x.reviews||0))tags.push('<span class="pp452-tag pp452-tag-star">⭐ '+e(String(x.rating||'—'))+' · '+e(String(x.reviews))+'</span>');
    if(!x.website)tags.push('<span class="pp452-tag pp452-tag-hot">Sem site</span>');
    return '<article class="pp452-lead">'+ppPhoto452(x)+
      '<div class="pp452-lead-body"><h4>'+e(x.name||'')+'</h4><p class="pp452-addr">'+e(x.address||'')+'</p>'+
      (x.phone?'<p class="pp452-addr">📞 '+e(x.phone)+'</p>':'')+
      '<div class="pp452-tags">'+tags.join('')+'</div>'+
      '<div class="pp452-actions">'+
      (done?'<span class="pp452-msg ok" style="margin:0">✓ Salvo no CRM</span>':'<button class="btn" onclick="ppSave452('+i+')">+ Salvar lead</button>')+
      (wa?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WhatsApp</a>':'')+
      (x.mapsUrl?'<a class="btn" target="_blank" rel="noopener" href="'+e(x.mapsUrl)+'">Maps</a>':'')+
      (x.website?'<a class="btn" target="_blank" rel="noopener" href="'+e(x.website)+'">Site</a>':'')+
      '</div></div></article>';
  }
  function ppResults452(){
    if(!PP452.data||!PP452.data.ok)return'';
    const r=PP452.data.results||{};
    const maps=r.maps||[],other=[...(r.google||[]),...(r.instagram||[]),...(r.facebook||[])];
    if(!maps.length&&!other.length)return'<div class="card empty">Nenhuma empresa encontrada. Ajuste a busca ou as fontes.</div>';
    let h='<div class="pp452-actions" style="margin-top:14px">'+
      (maps.length?'<button class="btn" onclick="ppSaveAll452()">Salvar todos no CRM</button>':'')+'</div>';
    if(maps.length)h+='<div class="pp452-grid">'+maps.map(ppMapCard452).join('')+'</div>';
    if(other.length)h+='<h3 style="margin:18px 0 4px">Resultados da web</h3><div class="pp452-grid">'+other.map(ppWebCard452).join('')+'</div>';
    return h;
  }
  window.ppSave452=async function(i){
    const x=PP452.data?.results?.maps?.[i];if(!x)return;
    const key=x.placeId||(x.name+'|'+x.address);
    try{
      const j=await api('/api/portal/prospect/save',{method:'POST',body:JSON.stringify({entityType:'lead',payload:{name:x.name,companyName:x.name,address:x.address,phone:x.phone,whatsapp:x.phone,website:x.website,source:'Google Maps',placeId:x.placeId,segment:x.segment,city:x.city,state:x.state,crmStatus:'Novo',category:x.category,rating:x.rating,reviews:x.reviews,mapsUrl:x.mapsUrl},query:PP452.data.query})});
      if(!j.ok)throw new Error(j.error||'Falha ao salvar.');
      PP452.saved[key]=true;
      const el=document.getElementById('pp452Results');if(el)el.innerHTML=ppResults452();
      ppMsg452('Lead salvo no CRM — a equipe vai atender.','ok');
    }catch(err){ppMsg452(err.message||'Falha ao salvar o lead.','warn')}
  };
  window.ppSaveAll452=async function(){
    const maps=PP452.data?.results?.maps||[];if(!maps.length)return;
    let ok=0,fail=0;
    for(let i=0;i<maps.length;i++){
      const key=maps[i].placeId||(maps[i].name+'|'+maps[i].address);
      if(PP452.saved[key]){ok++;continue}
      try{await ppSave452(i);if(PP452.saved[key])ok++;else fail++}catch{fail++}
    }
    ppMsg452(ok+' lead(s) salvo(s) no CRM'+(fail?' · '+fail+' falha(s)':''),'ok');
  };
  function prospectPage452(){
    let h='<div class="hero"><div><div class="eyebrow">PROSPECÇÃO</div><h2>Encontrar novas oportunidades</h2><p>Busque empresas por segmento e região e salve os melhores contatos direto no CRM.</p></div></div>';
    if(!isOwner452())return h+'<div class="card empty">Este recurso está disponível apenas para o perfil Proprietário do portal.</div>';
    h+='<div class="card"><div class="pp452-form">'+
      '<div class="field pp452-wide"><label>Segmento / tipo de empresa *</label><input id="pp452Seg" class="input" placeholder="Ex.: Construção civil"></div>'+
      '<div class="field"><label>Bairro / região</label><select id="pp452Region" class="input" onchange="ppRegionChanged452()"><option value="">— Selecione —</option>'+PP452_REGIONS.map(function(r){return '<option>'+r.name+'</option>'}).join('')+'<option value="__custom__">Outra (digitar)</option></select><input id="pp452RegionCustom" class="input hidden" placeholder="Digite o bairro/região" style="margin-top:6px"></div>'+
      '<div class="field"><label>Cidade</label><select id="pp452City" class="input" onchange="ppCityChanged452()"><option value="">— Selecione a região primeiro —</option></select><input id="pp452CityCustom" class="input hidden" placeholder="Digite a cidade" style="margin-top:6px"></div>'+
      '<div class="field"><label>UF</label><input id="pp452State" class="input" maxlength="2" placeholder="RJ"></div>'+
      '<div class="field"><label>Quantidade</label><select id="pp452Limit" class="input"><option>10</option><option selected>20</option><option>40</option></select></div>'+
      '<div class="field pp452-wide"><label>Fontes</label><div style="display:flex;gap:12px;flex-wrap:wrap;padding-top:8px">'+
        '<label><input type="checkbox" id="pp452Maps" checked> Google Maps</label>'+
        '<label><input type="checkbox" id="pp452Google"> Google</label>'+
        '<label><input type="checkbox" id="pp452Insta"> Instagram</label>'+
        '<label><input type="checkbox" id="pp452Face"> Facebook</label>'+
        '</div><div class="tiny muted" style="margin-top:6px">Instagram e Facebook: usamos busca com filtro por domínio oficial (compatível com contas gratuitas).</div></div>'+
      '</div><button class="btn" style="margin-top:14px" onclick="ppRun452()">⌕ Prospectar agora</button></div>'+
      '<div id="pp452Msg"></div><div id="pp452Results">'+(PP452.data&&PP452.data.ok?ppResults452():'')+'</div>';
    return h;
  }
  window.prospectPage452=prospectPage452;
  dashboard=function(){
    let h=baseDashboard452();
    if(!isOwner452())return h;
    h+='<div class="card"><div class="card-head"><div><div class="eyebrow">PROSPECÇÃO</div><h3>Encontrar novas oportunidades</h3><p class="muted tiny">Busque empresas por segmento e região e salve os contatos no CRM.</p></div><button class="btn" onclick="goPortalPros452()">Abrir prospecção</button></div></div>';
    return h;
  };
  render=function(){
    ensureProsNav452();
    if(P.page==='prospecting'){
      nav();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page==='prospecting'));
      $('clientChip').textContent=P.data?.client?.name||'';
      $('userChip').textContent=P.data?.user?.username+' · '+roleLabel(P.data?.user?.role);
      $('main').innerHTML=prospectPage452();
      return;
    }
    baseRender452();
  };
  setTimeout(()=>{try{ensureProsNav452()}catch{}},1700);
})();</script></body>
</html>
